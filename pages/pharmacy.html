<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💊 Pharmacy</h1>
                <p>Dispense medications based on doctor consultations.</p>
            </div>

            <!-- BACK TO DASHBOARD BUTTON -->
            <a href="../dashboard.html" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block;">⬅️ Back to Dashboard</a>

            <input type="text" id="searchPharmacy" placeholder="Search by Patient Name or P ID..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px;">

            <!-- Pharmacy Cards Container -->
            <div id="pharmacyCardContainer" class="pharmacy-grid">
                <p style="text-align: center; width: 100%; color:#888;">Loading prescriptions...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF PHARMACY INITIALIZATION ---
        enforceAuth(['pharmacy']);
        
        auth.onAuthStateChanged((user) => {
            if (!user) return;
            
            const cardContainer = document.getElementById('pharmacyCardContainer');
            const searchInput = document.getElementById('searchPharmacy');
            let debounceTimer;
            let unsubscribeSnapshot = null;

            // --- START OF SCALABLE INITIAL LOAD ---
            function loadInitialPrescriptions() {
                cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">Loading prescriptions...</p>`;
                
                if (unsubscribeSnapshot) unsubscribeSnapshot(); 

                unsubscribeSnapshot = db.collection('prescriptions')
                    .orderBy('createdAt', 'desc')
                    .limit(50) 
                    .onSnapshot((snapshot) => {
                        let prescriptions = [];
                        snapshot.forEach(doc => prescriptions.push({ id: doc.id, ...doc.data() }));
                        renderCards(prescriptions);
                    }, error => {
                        cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:red;">Error: ${error.message}</p>`;
                    });
            }
            // --- END OF SCALABLE INITIAL LOAD ---

            // --- START OF SCALABLE SERVER-SIDE SEARCH ---
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                clearTimeout(debounceTimer);

                if (term === "") {
                    loadInitialPrescriptions(); 
                    return;
                }

                debounceTimer = setTimeout(() => {
                    if (unsubscribeSnapshot) unsubscribeSnapshot(); 
                    
                    cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">Searching...</p>`;
                    
                    const searchTerm = term.charAt(0).toUpperCase() + term.slice(1).toLowerCase();
                    const upperTerm = term.toUpperCase();

                    const idQuery = db.collection('prescriptions').where('patientId', '==', upperTerm).get();
                    const nameQuery = db.collection('prescriptions')
                        .orderBy('patientName')
                        .startAt(searchTerm)
                        .endAt(searchTerm + '\uf8ff')
                        .limit(20)
                        .get();

                    Promise.all([idQuery, nameQuery]).then(([idSnap, nameSnap]) => {
                        let results = [];
                        let seenIds = new Set();

                        idSnap.forEach(doc => {
                            results.push({ id: doc.id, ...doc.data() });
                            seenIds.add(doc.id);
                        });

                        nameSnap.forEach(doc => {
                            if (!seenIds.has(doc.id)) {
                                results.push({ id: doc.id, ...doc.data() });
                                seenIds.add(doc.id);
                            }
                        });

                        results.sort((a, b) => {
                            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                            return timeB - timeA;
                        });

                        renderCards(results);
                    }).catch(error => {
                        console.error("Search Error:", error);
                        cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:red;">Search Error: ${error.message}</p>`;
                    });
                }, 300);
            });
            // --- END OF SCALABLE SERVER-SIDE SEARCH ---

            // --- START OF RENDER CARDS ---
            function renderCards(prescriptions) {
                if (prescriptions.length === 0) {
                    cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">No prescriptions found.</p>`;
                    return;
                }
                cardContainer.innerHTML = '';
                prescriptions.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    const badgeClass = d.status === 'Dispensed' ? 'status-complete' : 'status-pending';
                    
                    let actionHtml = '';
                    if (d.status === 'Pending') {
                        const safeMed = d.medication ? d.medication.replace(/'/g, "\\'") : '';
                        actionHtml = `<button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="dispenseDrug('${d.id}', '${d.patientId}', '${safeMed}')">Dispense</button>`;
                    } else {
                        actionHtml = `<span style="color:#065f46; font-weight:bold;">Dispensed</span>`;
                    }
                    
                    cardContainer.innerHTML += `
                        <div class="pharmacy-card">
                            <div class="pharmacy-card-header">
                                <span class="pharmacy-id">${d.patientId}</span>
                                <span class="pharmacy-date">${date}</span>
                            </div>
                            <div class="pharmacy-name">${d.patientName}</div>
                            <div style="font-size:12px; color:#6b7280;">Requested by: ${d.doctorName || 'Doctor'} (ID: ${d.doctorStaffId || 'N/A'})</div>
                            <div class="pharmacy-med">💊 ${d.medication}</div>
                            <div class="pharmacy-action">
                                <span class="status-badge ${badgeClass}">${d.status}</span>
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });
            }
            // --- END OF RENDER CARDS ---

            // --- START OF DISPENSE DRUG ---
            window.dispenseDrug = function(id, patientId, medication) {
                showConfirm("Confirm Dispense", `Have you dispensed <strong>${medication}</strong> for patient <strong>${patientId}</strong>?`, function() {
                    db.collection('prescriptions').doc(id).update({ status: 'Dispensed' })
                    .then(() => { 
                        logActivity(auth.currentUser, "Dispensed Drugs", `Patient ID: ${patientId}, Drug: ${medication}`); 
                        showAlert("Success", "Drugs dispensed successfully!", "✔️"); 
                    })
                    .catch((error) => showAlert("Error", error.message, "❌"));
                });
            };
            // --- END OF DISPENSE DRUG ---

            loadInitialPrescriptions();
        });
        // --- END OF PHARMACY INITIALIZATION ---
    </script>
</body>
</html>
