<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💊 Pharmacy</h1>
                <p>Dispense medications based on doctor consultations.</p>
            </div>

            <input type="text" id="searchPharmacy" placeholder="Search by Patient Name or P ID..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px;">

            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Requested By</th>
                        <th>Prescription</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pharmacyTableBody">
                    <tr><td colspan="7" style="text-align:center; color:#888;">Loading prescriptions...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        <script>
    enforceAuth(['pharmacy']); // <-- ADD THIS LINE: Reroute all entry to the frontdoor & check role
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = '../login.html'; return; }

            const tbody = document.getElementById('pharmacyTableBody');
            const searchInput = document.getElementById('searchPharmacy');
            let allPrescriptions = [];

            db.collection('prescriptions').onSnapshot((snapshot) => {
                allPrescriptions = [];
                snapshot.forEach(doc => allPrescriptions.push({ id: doc.id, ...doc.data() }));
                
                allPrescriptions.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                renderTable(allPrescriptions);
            });

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allPrescriptions.filter(p => {
                    const name = String(p.patientName).toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    return name.includes(term) || pid.includes(term);
                });
                renderTable(filtered);
            });

            function renderTable(prescriptions) {
                if (prescriptions.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No prescriptions found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                prescriptions.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                    const badgeClass = d.status === 'Dispensed' ? 'status-complete' : 'status-pending';
                    
                    let actionHtml = '';
                    if (d.status === 'Pending') {
                        actionHtml = `<button class="btn btn-primary" onclick="dispenseDrug('${d.id}')">Dispense</button>`;
                    } else {
                        actionHtml = `<span style="color:#065f46; font-weight:bold;">Done</span>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.patientName}</strong></td>
                            <td>${d.doctorName || 'Doctor'} <br><small>ID: ${d.doctorStaffId || 'N/A'}</small></td>
                            <td style="color: #2563eb; font-weight: bold;">${d.medication}</td>
                            <td>${date}</td>
                            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            }

            window.dispenseDrug = function(id) {
                if(confirm("Have you dispensed these drugs?")) {
                    db.collection('prescriptions').doc(id).update({
                        status: 'Dispensed'
                    }).then(() => {
                        logActivity(auth.currentUser, "Dispensed Drugs", `Prescription ID: ${id}`);
                        alert('Dispensed successfully!');
                    }).catch((error) => alert("Error: " + error.message));
                }
            };
        });
    </script>
</body>
</html>
