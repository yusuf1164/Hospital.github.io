<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💊 Pharmacy</h1>
                <p>Dispense medications and manage inventory.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <!-- MODERN TABS -->
            <div class="modern-tabs">
                <button class="modern-tab active" onclick="switchTab('queue', this)" id="tab-queue">OPD Queue</button>
                <button class="modern-tab" onclick="switchTab('walkin', this)" id="tab-walkin">Walk-in POS</button>
                <button class="modern-tab" onclick="switchTab('inventory', this)" id="tab-inventory">Inventory</button>
            </div>

            <!-- TAB 1: OPD QUEUE -->
            <div id="section-queue">
                <input type="text" id="searchPharmacy" placeholder="Search by Patient Name or P ID..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px;">
                <div id="pharmacyCardContainer" class="card-grid-layout">
                    <p style="text-align: center; width: 100%; color:#888;">Loading prescriptions...</p>
                </div>
            </div>

            <!-- TAB 2: WALK-IN POS -->
            <div id="section-walkin" style="display: none;">
                <div class="pos-grid">
                    <div class="form-card">
                        <h3>Add to Cart</h3>
                        <div class="form-grid">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Select Drug (Check Expiry)</label>
                                <select id="posDrugSelect" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" onchange="updateSellUnitDropdown('pos')">
                                    <option value="">Loading drugs...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Sell By</label>
                                <select id="posSellUnit" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                                    <option value="">Select drug first...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" id="posQty" value="1" min="1" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                            </div>
                        </div>
                        <button onclick="addToCart('pos')" class="btn btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;">+ Add to Cart</button>
                    </div>

                    <div class="pos-cart">
                        <h3>Cart Summary</h3>
                        <div id="cartItems" style="margin-top: 15px; max-height: 300px; overflow-y: auto;">
                            <p style="color: #888; font-size: 14px;">Cart is empty.</p>
                        </div>
                        <div class="pos-total">
                            <span>Total:</span>
                            <span id="cartTotal">₦0</span>
                        </div>
                        <button onclick="checkoutCart('Walk-in Customer')" class="btn-submit" style="margin-top: 20px; background-color: #10b981; width: 100%;">Send Bill to Billing</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: INVENTORY MANAGEMENT -->
            <div id="section-inventory" style="display: none;">
                <div class="form-card" style="border-left: 4px solid #10b981;">
                    <h3>Add New Drug to Inventory</h3>
                    <form id="inventoryForm">
                        <div class="form-grid">
                            <div class="form-group"><label>Drug Name</label><input type="text" id="drugName" required placeholder="e.g. Amoxicillin 500mg"></div>
                            <div class="form-group">
                                <label>Base Unit (Smallest)</label>
                                <select id="baseUnit" required>
                                    <option value="Tablet">Tablet</option>
                                    <option value="Capsule">Capsule</option>
                                    <option value="Bottle">Bottle</option>
                                    <option value="Tube">Tube</option>
                                    <option value="Sachet">Sachet</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Packaging Unit</label>
                                <select id="packagingUnit" required>
                                    <option value="Pack">Pack</option>
                                    <option value="Box">Box</option>
                                    <option value="Carton">Carton</option>
                                    <option value="None">None (Loose)</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Units per Packaging</label><input type="number" id="unitsPerPackaging" required placeholder="e.g. 10" value="1"></div>
                            <div class="form-group"><label>Quantity Received</label><input type="number" id="quantityReceived" required placeholder="e.g. 5 (Packs)"></div>
                            <div class="form-group"><label>Expiry Date</label><input type="date" id="expiryDate" required></div>
                            <div class="form-group"><label>Price per Base Unit (₦)</label><input type="number" id="drugPrice" required placeholder="e.g. 50"></div>
                        </div>
                        <button type="submit" class="btn-submit" id="addDrugBtn" style="margin-top: 15px; max-width: 200px;">Add Drug</button>
                    </form>
                </div>

                <h3 style="color: #1e3a8a; margin-bottom: 15px;">Current Inventory (Sorted by Expiry)</h3>
                <div id="inventoryCardContainer" class="card-grid-layout"></div>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <!-- MODAL: Process OPD Prescription -->
    <div id="processOpdModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 style="color: #1e3a8a; margin-bottom: 10px;">Process Prescription</h3>
            <div style="background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <strong style="color: #dc2626;">Doctor's Note:</strong>
                <p id="doctorNote" style="margin-top: 5px; font-style: italic;"></p>
            </div>

            <div class="form-grid" style="background:#f9fafb; padding:15px; border-radius:8px; border:1px solid #e5e7eb; margin-bottom: 15px;">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Select Drug (Fix Typos)</label>
                    <select id="opdDrugSelect" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" onchange="updateSellUnitDropdown('opd')">
                        <option value="">Select from inventory...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sell By</label>
                    <select id="opdSellUnit" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="opdQty" value="1" min="1" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div class="form-group" style="display:flex; align-items:flex-end;">
                    <button onclick="addToCart('opd')" class="btn btn-primary" style="width: 100%; padding: 11px;">+ Add</button>
                </div>
            </div>

            <h4>Prescription Cart</h4>
            <div id="opdCartItems" style="margin: 15px 0; max-height: 200px; overflow-y: auto;"></div>
            
            <div class="pos-total" style="margin-bottom: 15px;">
                <span>Total:</span>
                <span id="opdCartTotal">₦0</span>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="closeModal('processOpdModal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1; background-color: #10b981;" onclick="finalizeOpd()">Finalize & Send to Billing</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF PHARMACY INITIALIZATION ---
        enforceAuth(['pharmacy', 'admin']);
        let globalInventory = [];
        let posCart = [];
        let opdCart = [];
        let currentOpdRequest = null;

        window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; };

        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.modern-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('section-queue').style.display = tab === 'queue' ? 'block' : 'none';
            document.getElementById('section-walkin').style.display = tab === 'walkin' ? 'block' : 'none';
            document.getElementById('section-inventory').style.display = tab === 'inventory' ? 'block' : 'none';
        };

        auth.onAuthStateChanged((user) => {
            if (!user) return;
            
            const cardContainer = document.getElementById('pharmacyCardContainer');
            const inventoryContainer = document.getElementById('inventoryCardContainer');
            const searchInput = document.getElementById('searchPharmacy');
            let debounceTimer;
            let unsubscribeSnapshot = null;

            // --- START OF OPD QUEUE LOGIC ---
            function loadInitialPrescriptions() {
                cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">Loading...</p>`;
                if (unsubscribeSnapshot) unsubscribeSnapshot(); 
                unsubscribeSnapshot = db.collection('prescriptions').orderBy('createdAt', 'desc').limit(50).onSnapshot((snapshot) => {
                    let prescriptions = [];
                    snapshot.forEach(doc => prescriptions.push({ id: doc.id, ...doc.data() }));
                    renderPrescriptionCards(prescriptions);
                });
            }

            function renderPrescriptionCards(prescriptions) {
                if (prescriptions.length === 0) { cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">No prescriptions found.</p>`; return; }
                cardContainer.innerHTML = '';
                prescriptions.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    const badgeClass = d.status === 'Dispensed' ? 'status-complete' : 'status-pending';
                    let actionHtml = d.status === 'Pending' 
                        ? `<button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick='openProcessModal(${JSON.stringify(d).replace(/'/g, "&#39;")})'>Process</button>`
                        : `<span style="color:#065f46; font-weight:bold;">Dispensed</span>`;
                    cardContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header"><span class="data-id">${d.patientId}</span><span class="data-date">${date}</span></div>
                            <div class="data-name">${d.patientName}</div>
                            <div style="font-size:12px; color:#6b7280;">Requested by: ${d.doctorName || 'Doctor'}</div>
                            <div class="data-info" style="margin-top:10px;"><strong>Doctor's Note:</strong> ${d.medication}</div>
                            <div class="data-action"><span class="status-badge ${badgeClass}">${d.status}</span>${actionHtml}</div>
                        </div>
                    `;
                });
            }
            // --- END OF OPD QUEUE LOGIC ---

            // --- START OF MODAL CART LOGIC ---
            window.updateSellUnitDropdown = function(context) {
                const drugId = document.getElementById(context + 'DrugSelect').value;
                const sellUnitDropdown = document.getElementById(context + 'SellUnit');
                sellUnitDropdown.innerHTML = '<option value="">Select unit...</option>';
                if (!drugId) return;
                const drug = globalInventory.find(d => d.id === drugId);
                if (!drug) return;
                sellUnitDropdown.innerHTML += `<option value="${drug.baseUnit}">${drug.baseUnit}</option>`;
                if (drug.packagingUnit !== 'None') {
                    sellUnitDropdown.innerHTML += `<option value="${drug.packagingUnit}">${drug.packagingUnit}</option>`;
                }
            };

            window.addToCart = function(context) {
                const drugId = document.getElementById(context + 'DrugSelect').value;
                const sellUnit = document.getElementById(context + 'SellUnit').value;
                const qty = parseInt(document.getElementById(context + 'Qty').value);
                if (!drugId || !sellUnit || qty < 1) { showAlert("Error", "Please select drug, unit, and quantity.", "❌"); return; }
                const drug = globalInventory.find(d => d.id === drugId);
                if (!drug) return;
                let multiplier = 1;
                if (sellUnit === drug.packagingUnit) multiplier = drug.unitsPerPackaging;
                const totalBaseUnitsNeeded = qty * multiplier;
                if (drug.stock < totalBaseUnitsNeeded) { showAlert("Error", `Not enough stock. Only ${drug.stock} ${drug.baseUnit}s left.`, "❌"); return; }

                const cart = context === 'pos' ? posCart : opdCart;
                cart.push({
                    id: drug.id, 
                    name: `${drug.name}`, // Clean name for the bill
                    sellUnit: sellUnit, qty: qty,
                    baseUnitsDeducted: totalBaseUnitsNeeded, pricePerBase: drug.price, totalPrice: totalBaseUnitsNeeded * drug.price
                });
                renderCart(context);
                document.getElementById(context + 'Qty').value = 1;
            };

            function renderCart(context) {
                const cart = context === 'pos' ? posCart : opdCart;
                const cartId = context === 'pos' ? 'cartItems' : 'opdCartItems';
                const totalId = context === 'pos' ? 'cartTotal' : 'opdCartTotal';
                const container = document.getElementById(cartId);
                const totalEl = document.getElementById(totalId);

                if (cart.length === 0) {
                    container.innerHTML = '<p style="color: #888; font-size: 14px;">Cart is empty.</p>';
                    totalEl.textContent = '₦0';
                    return;
                }
                container.innerHTML = '';
                let total = 0;
                cart.forEach((item, index) => {
                    total += item.totalPrice;
                    container.innerHTML += `
                        <div class="pos-cart-item">
                            <div>
                                <strong>${item.name}</strong><br>
                                <small style="color:#666;">${item.qty} x ${item.sellUnit} @ ₦${item.pricePerBase}/${item.name.includes('Syrup') ? 'unit' : 'base'}</small>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <strong>₦${item.totalPrice.toLocaleString()}</strong>
                                <button onclick="removeFromCart('${context}', ${index})" style="background:none; border:none; cursor:pointer;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" style="fill: #dc2626; width: 18px; height: 18px;"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg></button>
                            </div>
                        </div>
                    `;
                });
                totalEl.textContent = `₦${total.toLocaleString()}`;
            }

            window.removeFromCart = function(context, index) {
                const cart = context === 'pos' ? posCart : opdCart;
                cart.splice(index, 1);
                renderCart(context);
            };
            // --- END OF MODAL CART LOGIC ---

            // --- START OF OPD PROCESSING (UPDATED TO SHOW DRUG NAMES) ---
            window.openProcessModal = function(prescriptionData) {
                currentOpdRequest = prescriptionData;
                document.getElementById('doctorNote').textContent = prescriptionData.medication;
                const opdDrugSelect = document.getElementById('opdDrugSelect');
                opdDrugSelect.innerHTML = '<option value="">Select from inventory...</option>';
                globalInventory.forEach(drug => {
                    opdDrugSelect.innerHTML += `<option value="${drug.id}">${drug.name} (Exp: ${drug.expiryDate}) [${drug.stock} left]</option>`;
                });
                opdCart = [];
                renderCart('opd');
                document.getElementById('processOpdModal').style.display = 'flex';
            };

            window.finalizeOpd = function() {
                if (opdCart.length === 0) { showAlert("Error", "Cart is empty.", "❌"); return; }
                if (!currentOpdRequest) return;
                const totalAmount = opdCart.reduce((sum, item) => sum + item.totalPrice, 0);
                
                // Create a comma-separated string of drug names for the bill
                const drugNames = opdCart.map(item => item.name).join(', ');
                
                const batch = db.batch();

                opdCart.forEach(item => {
                    const invRef = db.collection('inventory').doc(item.id);
                    batch.update(invRef, { stock: firebase.firestore.FieldValue.increment(-item.baseUnitsDeducted) });
                });

                const billRef = db.collection('bills').doc();
                batch.set(billRef, {
                    patientId: currentOpdRequest.patientId, 
                    patientName: currentOpdRequest.patientName,
                    service: `Pharmacy: ${drugNames}`, // SHOWS DRUG NAMES
                    items: opdCart, 
                    amount: totalAmount, 
                    status: 'Pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const prescRef = db.collection('prescriptions').doc(currentOpdRequest.id);
                batch.update(prescRef, { status: 'Dispensed' });

                batch.commit().then(() => {
                    logActivity(auth.currentUser, "Dispensed OPD", `Patient: ${currentOpdRequest.patientId}, Total: ₦${totalAmount}`);
                    showAlert("Success", "Prescription finalized and sent to Billing!", "✔️");
                    closeModal('processOpdModal');
                    currentOpdRequest = null;
                }).catch(err => showAlert("Error", err.message, "❌"));
            };
            // --- END OF OPD PROCESSING ---

            // --- START OF POS CHECKOUT (UPDATED TO SHOW DRUG NAMES) ---
            window.checkoutCart = function(customerName) {
                if (posCart.length === 0) { showAlert("Error", "Cart is empty.", "❌"); return; }
                const totalAmount = posCart.reduce((sum, item) => sum + item.totalPrice, 0);
                
                // Create a comma-separated string of drug names for the bill
                const drugNames = posCart.map(item => item.name).join(', ');

                const batch = db.batch();

                posCart.forEach(item => {
                    const invRef = db.collection('inventory').doc(item.id);
                    batch.update(invRef, { stock: firebase.firestore.FieldValue.increment(-item.baseUnitsDeducted) });
                });

                const billRef = db.collection('bills').doc();
                batch.set(billRef, {
                    patientId: "WALK-IN", 
                    patientName: customerName,
                    service: `Walk-in Pharmacy: ${drugNames}`, // SHOWS DRUG NAMES
                    items: posCart, 
                    amount: totalAmount, 
                    status: 'Pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                batch.commit().then(() => {
                    logActivity(auth.currentUser, "Walk-in Sale", `Amount: ₦${totalAmount}`);
                    showAlert("Success", "Sale finalized and sent to Billing!", "✔️");
                    posCart = [];
                    renderCart('pos');
                }).catch(err => showAlert("Error", err.message, "❌"));
            };
            // --- END OF POS CHECKOUT ---

            // --- START OF INVENTORY MANAGEMENT ---
            document.getElementById('inventoryForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('addDrugBtn');
                btn.textContent = 'Adding...'; btn.disabled = true;
                const qtyReceived = Number(document.getElementById('quantityReceived').value);
                const unitsPerPackaging = Number(document.getElementById('unitsPerPackaging').value) || 1;
                const totalBaseUnits = qtyReceived * unitsPerPackaging;

                db.collection('inventory').add({
                    name: document.getElementById('drugName').value,
                    baseUnit: document.getElementById('baseUnit').value,
                    packagingUnit: document.getElementById('packagingUnit').value,
                    unitsPerPackaging: unitsPerPackaging,
                    stock: totalBaseUnits,
                    expiryDate: document.getElementById('expiryDate').value,
                    price: Number(document.getElementById('drugPrice').value),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showAlert("Success", "Drug added to inventory!", "✔️");
                    document.getElementById('inventoryForm').reset();
                    btn.textContent = 'Add Drug'; btn.disabled = false;
                }).catch(err => {
                    showAlert("Error", err.message, "❌");
                    btn.textContent = 'Add Drug'; btn.disabled = false;
                });
            });

            window.restockDrug = function(id, name, baseUnit) {
                showPrompt("Restock Drug", `How many <strong>${baseUnit}s</strong> of ${name} are you adding to stock?`, "10", (qty) => {
                    const amount = parseInt(qty);
                    if (isNaN(amount) || amount <= 0) {
                        showAlert("Error", "Please enter a valid number.", "❌");
                        return;
                    }
                    db.collection('inventory').doc(id).update({
                        stock: firebase.firestore.FieldValue.increment(amount)
                    }).then(() => {
                        logActivity(auth.currentUser, "Restocked", `Added ${amount} ${baseUnit}s to ${name}`);
                        showAlert("Success", `Successfully added ${amount} ${baseUnit}s to stock!`, "✔️");
                    }).catch(err => showAlert("Error", err.message, "❌"));
                });
            };

            // Sort Inventory by Expiry Date (Soonest first)
            db.collection('inventory').orderBy('expiryDate', 'asc').onSnapshot(snapshot => {
                globalInventory = [];
                const posDrugSelect = document.getElementById('posDrugSelect');
                posDrugSelect.innerHTML = '<option value="">Select drug...</option>';
                
                if (snapshot.empty) {
                    inventoryContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">No drugs in inventory.</p>`;
                    return;
                }
                
                inventoryContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    globalInventory.push({ id: doc.id, ...d });
                    
                    posDrugSelect.innerHTML += `<option value="${doc.id}">${d.name} (Exp: ${d.expiryDate}) [${d.stock} left]</option>`;

                    const fullPackages = Math.floor(d.stock / d.unitsPerPackaging);
                    const looseUnits = d.stock % d.unitsPerPackaging;
                    let stockDisplay = `${d.stock} ${d.baseUnit}(s)`;
                    if (d.packagingUnit !== 'None' && d.unitsPerPackaging > 1) {
                        stockDisplay += ` (${fullPackages} ${d.packagingUnit}(s)`;
                        if (looseUnits > 0) stockDisplay += ` + ${looseUnits} Loose`;
                        stockDisplay += `)`;
                    }

                    const today = new Date();
                    const expiry = new Date(d.expiryDate);
                    const daysToExpiry = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
                    let expiryHtml = `Expires: ${d.expiryDate}`;
                    let expiryClass = '';
                    if (daysToExpiry <= 30) { expiryHtml = `⚠️ EXPIRING SOON: ${d.expiryDate}`; expiryClass = 'color: #dc2626; font-weight: bold;'; }
                    const badgeClass = d.stock > 10 ? 'status-complete' : 'status-pending';

                    inventoryContainer.innerHTML += `
                        <div class="data-card" style="border-left: 4px solid #10b981;">
                            <div class="data-card-header">
                                <span class="data-id">${d.name}</span>
                                <span class="data-date">₦${d.price.toLocaleString()} / ${d.baseUnit}</span>
                            </div>
                            <div class="data-info" style="margin-top:10px; background:#fff;">
                                <strong>Stock:</strong> <span class="status-badge ${badgeClass}">${stockDisplay}</span><br>
                                <small style="${expiryClass}">${expiryHtml}</small>
                            </div>
                            <div class="data-action" style="margin-top: 10px; justify-content: flex-end;">
                                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 12px; border-color: #10b981; color: #10b981;" onclick="restockDrug('${doc.id}', '${d.name.replace(/'/g, "\\'")}', '${d.baseUnit}')">+ Restock</button>
                            </div>
                        </div>
                    `;
                });
            });
            // --- END OF INVENTORY MANAGEMENT ---

            loadInitialPrescriptions();
        });
        // --- END OF PHARMACY INITIALIZATION ---
    </script>
</body>
</html>
