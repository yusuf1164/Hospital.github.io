<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💊 Pharmacy</h1>
                <p>Dispense medications and manage inventory.</p>
            </div>

            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <!-- PHARMACY TABS -->
            <div class="pharmacy-tabs">
                <button class="pharmacy-tab active" onclick="switchTab('queue')" id="tab-queue">OPD Queue</button>
                <button class="pharmacy-tab" onclick="switchTab('walkin')" id="tab-walkin">Walk-in Sales</button>
                <button class="pharmacy-tab" onclick="switchTab('inventory')" id="tab-inventory">Inventory</button>
            </div>

            <!-- TAB 1: OPD QUEUE -->
            <div id="section-queue">
                <input type="text" id="searchPharmacy" placeholder="Search by Patient Name or P ID..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px;">
                <div id="pharmacyCardContainer" class="card-grid-layout">
                    <p style="text-align: center; width: 100%; color:#888;">Loading prescriptions...</p>
                </div>
            </div>

            <!-- TAB 2: WALK-IN SALES (POS) -->
            <div id="section-walkin" style="display: none;">
                <div class="pos-grid">
                    <!-- POS Form -->
                    <div class="form-card">
                        <h3>Add to Cart</h3>
                        <div class="form-grid">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Select Drug (Inventory)</label>
                                <select id="posDrugSelect" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                                    <option value="">Loading drugs...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" id="posQty" value="1" min="1" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                            </div>
                            <div class="form-group" style="display:flex; align-items:flex-end;">
                                <button onclick="addToCart()" class="btn btn-primary" style="width: 100%; padding: 11px;">+ Add</button>
                            </div>
                        </div>
                    </div>

                    <!-- Cart Display -->
                    <div class="pos-cart">
                        <h3>Cart Summary</h3>
                        <div id="cartItems" style="margin-top: 15px; max-height: 250px; overflow-y: auto;">
                            <p style="color: #888; font-size: 14px;">Cart is empty.</p>
                        </div>
                        <div class="pos-total">
                            <span>Total:</span>
                            <span id="cartTotal">₦0</span>
                        </div>
                        
                        <div class="form-group" style="margin-top: 15px;">
                            <label>Payment Method</label>
                            <select id="posPaymentMethod" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                                <option value="Cash">Cash</option>
                                <option value="POS">POS</option>
                                <option value="Transfer">Bank Transfer</option>
                            </select>
                        </div>

                        <button onclick="checkoutWalkin()" class="btn-submit" style="margin-top: 10px; background-color: #10b981;">Complete Sale</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: INVENTORY MANAGEMENT -->
            <div id="section-inventory" style="display: none;">
                <div class="form-card" style="border-left: 4px solid #10b981;">
                    <h3>Add New Drug to Inventory</h3>
                    <form id="inventoryForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Drug Name</label>
                                <input type="text" id="drugName" required placeholder="e.g. Paracetamol 500mg">
                            </div>
                            <div class="form-group">
                                <label>Price (₦)</label>
                                <input type="number" id="drugPrice" required placeholder="e.g. 500">
                            </div>
                            <div class="form-group">
                                <label>Initial Stock (Quantity)</label>
                                <input type="number" id="drugStock" required placeholder="e.g. 100">
                            </div>
                        </div>
                        <button type="submit" class="btn-submit" id="addDrugBtn" style="margin-top: 15px; max-width: 200px;">Add Drug</button>
                    </form>
                </div>

                <h3 style="color: #1e3a8a; margin-bottom: 15px;">Current Inventory</h3>
                <div id="inventoryCardContainer" class="card-grid-layout">
                    <p style="text-align: center; width: 100%; color:#888;">Loading inventory...</p>
                </div>
            </div>

        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <!-- MODAL: Dispense Payment Method -->
    <div id="dispenseModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Complete Dispense</h3>
            <p style="margin-bottom: 10px; font-size: 14px;">Patient: <strong id="dispPatient"></strong></p>
            <p style="margin-bottom: 10px; font-size: 14px;">Drug: <strong id="dispDrug"></strong></p>
            <p style="margin-bottom: 20px; font-size: 14px;">Price: <strong id="dispPrice" style="color:#2563eb;"></strong></p>
            
            <div class="form-group">
                <label>Payment Method</label>
                <select id="dispPaymentMethod" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    <option value="Cash">Cash</option>
                    <option value="POS">POS</option>
                    <option value="Transfer">Bank Transfer</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="closeModal('dispenseModal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmDispense()">Confirm & Bill</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF PHARMACY INITIALIZATION ---
        enforceAuth(['pharmacy', 'admin']);
        
        let globalInventory = []; // Store inventory for POS
        let currentCart = []; // Store POS cart items
        let pendingDispenseData = null; // Store data for dispense modal

        window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; };

        // --- START OF TAB SWITCHING LOGIC ---
        window.switchTab = function(tab) {
            document.getElementById('section-queue').style.display = tab === 'queue' ? 'block' : 'none';
            document.getElementById('section-walkin').style.display = tab === 'walkin' ? 'block' : 'none';
            document.getElementById('section-inventory').style.display = tab === 'inventory' ? 'block' : 'none';
            
            document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
            document.getElementById('tab-walkin').classList.toggle('active', tab === 'walkin');
            document.getElementById('tab-inventory').classList.toggle('active', tab === 'inventory');
        };
        // --- END OF TAB SWITCHING LOGIC ---

        auth.onAuthStateChanged((user) => {
            if (!user) return;
            
            const cardContainer = document.getElementById('pharmacyCardContainer');
            const inventoryContainer = document.getElementById('inventoryCardContainer');
            const searchInput = document.getElementById('searchPharmacy');
            const posDrugSelect = document.getElementById('posDrugSelect');
            let debounceTimer;
            let unsubscribeSnapshot = null;

            // --- START OF OPD QUEUE LOGIC ---
            function loadInitialPrescriptions() {
                cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">Loading prescriptions...</p>`;
                if (unsubscribeSnapshot) unsubscribeSnapshot(); 

                unsubscribeSnapshot = db.collection('prescriptions').orderBy('createdAt', 'desc').limit(50).onSnapshot((snapshot) => {
                    let prescriptions = [];
                    snapshot.forEach(doc => prescriptions.push({ id: doc.id, ...doc.data() }));
                    renderPrescriptionCards(prescriptions);
                });
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                clearTimeout(debounceTimer);
                if (term === "") { loadInitialPrescriptions(); return; }

                debounceTimer = setTimeout(async () => {
                    if (unsubscribeSnapshot) unsubscribeSnapshot(); 
                    cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">Searching...</p>`;
                    
                    const searchTerm = term.charAt(0).toUpperCase() + term.slice(1);
                    const upperTerm = term.toUpperCase();

                    const idQuery = db.collection('prescriptions').where('patientId', '==', upperTerm).get();
                    const nameQuery = db.collection('prescriptions').orderBy('patientName').startAt(searchTerm).endAt(searchTerm + '\uf8ff').limit(20).get();

                    Promise.all([idQuery, nameQuery]).then(([idSnap, nameSnap]) => {
                        let results = []; let seenIds = new Set();
                        idSnap.forEach(doc => { results.push({ id: doc.id, ...doc.data() }); seenIds.add(doc.id); });
                        nameSnap.forEach(doc => { if (!seenIds.has(doc.id)) { results.push({ id: doc.id, ...doc.data() }); seenIds.add(doc.id); } });
                        results.sort((a, b) => (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0));
                        renderPrescriptionCards(results);
                    });
                }, 600);
            });

            function renderPrescriptionCards(prescriptions) {
                if (prescriptions.length === 0) { cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">No prescriptions found.</p>`; return; }
                cardContainer.innerHTML = '';
                prescriptions.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    const badgeClass = d.status === 'Dispensed' ? 'status-complete' : 'status-pending';
                    let actionHtml = d.status === 'Pending' 
                        ? `<button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="openDispenseModal('${d.id}', '${d.patientId}', '${d.patientName}', '${d.medication.replace(/'/g, "\\'")}')">Dispense</button>`
                        : `<span style="color:#065f46; font-weight:bold;">Dispensed</span>`;
                    
                    cardContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header">
                                <span class="data-id">${d.patientId}</span>
                                <span class="data-date">${date}</span>
                            </div>
                            <div class="data-name">${d.patientName}</div>
                            <div style="font-size:12px; color:#6b7280;">Requested by: ${d.doctorName || 'Doctor'}</div>
                            <div class="data-info" style="margin-top:10px;"><strong>Medication:</strong> ${d.medication}</div>
                            <div class="data-action">
                                <span class="status-badge ${badgeClass}">${d.status}</span>
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });
            }

            // --- START OF DISPENSE MODAL LOGIC ---
            window.openDispenseModal = function(id, patientId, patientName, medication) {
                // Find price in inventory (if it exists)
                const inventoryItem = globalInventory.find(i => i.name.toLowerCase().includes(medication.toLowerCase()));
                const price = inventoryItem ? inventoryItem.price : 0;

                pendingDispenseData = { id, patientId, patientName, medication, price };

                document.getElementById('dispPatient').textContent = patientName;
                document.getElementById('dispDrug').textContent = medication;
                document.getElementById('dispPrice').textContent = `₦${price.toLocaleString()}`;
                document.getElementById('dispenseModal').style.display = 'flex';
            };

            window.confirmDispense = function() {
                if (!pendingDispenseData) return;
                const paymentMethod = document.getElementById('dispPaymentMethod').value;
                const { id, patientId, patientName, medication, price } = pendingDispenseData;

                closeModal('dispenseModal');

                // 1. Update Prescription Status
                db.collection('prescriptions').doc(id).update({ status: 'Dispensed' }).then(() => {
                    
                    // 2. Generate Bill if price > 0
                    if (price > 0) {
                        db.collection('bills').add({
                            patientId: patientId,
                            patientName: patientName,
                            service: `Pharmacy - ${medication}`,
                            amount: price,
                            status: 'Paid', // Marked as paid because they paid at the counter
                            paymentMethod: paymentMethod,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }

                    // 3. Deduct Stock (Optional: Only if we matched a drug)
                    if (price > 0) {
                        const invItem = globalInventory.find(i => i.name.toLowerCase().includes(medication.toLowerCase()));
                        if (invItem) {
                            db.collection('inventory').doc(invItem.id).update({
                                stock: firebase.firestore.FieldValue.increment(-1)
                            });
                        }
                    }

                    logActivity(auth.currentUser, "Dispensed Drugs", `Patient: ${patientId}, Drug: ${medication}, Payment: ${paymentMethod}`);
                    showAlert("Success", "Drugs dispensed and bill generated!", "✔️");
                    pendingDispenseData = null;
                }).catch(err => showAlert("Error", err.message, "❌"));
            };
            // --- END OF DISPENSE MODAL LOGIC ---

            // --- START OF POS LOGIC ---
            window.addToCart = function() {
                const drugId = posDrugSelect.value;
                const qty = parseInt(document.getElementById('posQty').value);

                if (!drugId || qty < 1) { showAlert("Error", "Please select a drug and valid quantity.", "❌"); return; }

                const drug = globalInventory.find(d => d.id === drugId);
                if (!drug) return;
                if (drug.stock < qty) { showAlert("Error", `Only ${drug.stock} units of ${drug.name} left in stock.`, "❌"); return; }

                // Check if already in cart
                const existing = currentCart.find(c => c.id === drugId);
                if (existing) {
                    if (existing.qty + qty > drug.stock) { showAlert("Error", "Not enough stock for this total quantity.", "❌"); return; }
                    existing.qty += qty;
                } else {
                    currentCart.push({ id: drug.id, name: drug.name, price: drug.price, qty: qty });
                }

                renderCart();
                document.getElementById('posQty').value = 1;
            };

            function renderCart() {
                const cartContainer = document.getElementById('cartItems');
                const totalContainer = document.getElementById('cartTotal');
                
                if (currentCart.length === 0) {
                    cartContainer.innerHTML = '<p style="color: #888; font-size: 14px;">Cart is empty.</p>';
                    totalContainer.textContent = '₦0';
                    return;
                }

                cartContainer.innerHTML = '';
                let total = 0;

                currentCart.forEach((item, index) => {
                    total += (item.price * item.qty);
                    cartContainer.innerHTML += `
                        <div class="pos-cart-item">
                            <div>
                                <strong>${item.name}</strong><br>
                                <small style="color:#666;">${item.qty} x ₦${item.price.toLocaleString()}</small>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <strong>₦${(item.price * item.qty).toLocaleString()}</strong>
                                <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#dc2626; cursor:pointer;">✖</button>
                            </div>
                        </div>
                    `;
                });

                totalContainer.textContent = `₦${total.toLocaleString()}`;
            }

            window.removeFromCart = function(index) {
                currentCart.splice(index, 1);
                renderCart();
            };

            window.checkoutWalkin = function() {
                if (currentCart.length === 0) { showAlert("Error", "Cart is empty.", "❌"); return; }
                const paymentMethod = document.getElementById('posPaymentMethod').value;
                const total = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                showConfirm("Complete Sale", `Confirm payment of <strong>₦${total.toLocaleString()}</strong> via ${paymentMethod}?`, () => {
                    const batch = db.batch();

                    // 1. Generate Bill
                    const billRef = db.collection('bills').doc();
                    batch.set(billRef, {
                        patientId: "WALK-IN",
                        patientName: "Walk-in Customer (OTC)",
                        service: `Pharmacy Walk-in (${currentCart.length} items)`,
                        amount: total,
                        status: 'Paid',
                        paymentMethod: paymentMethod,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 2. Deduct Stock
                    currentCart.forEach(item => {
                        const invRef = db.collection('inventory').doc(item.id);
                        batch.update(invRef, { stock: firebase.firestore.FieldValue.increment(-item.qty) });
                    });

                    batch.commit().then(() => {
                        logActivity(auth.currentUser, "Walk-in Sale", `Amount: ₦${total}, Method: ${paymentMethod}`);
                        showAlert("Success", "Sale completed successfully!", "✔️");
                        currentCart = [];
                        renderCart();
                    }).catch(err => showAlert("Error", err.message, "❌"));
                });
            };
            // --- END OF POS LOGIC ---

            // --- START OF INVENTORY MANAGEMENT LOGIC ---
            document.getElementById('inventoryForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('addDrugBtn');
                btn.textContent = 'Adding...'; btn.disabled = true;

                db.collection('inventory').add({
                    name: document.getElementById('drugName').value,
                    price: Number(document.getElementById('drugPrice').value),
                    stock: Number(document.getElementById('drugStock').value),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showAlert("Success", "Drug added to inventory!", "✔️");
                    document.getElementById('inventoryForm').reset();
                    btn.textContent = 'Add Drug'; btn.disabled = false;
                }).catch(err => {
                    showAlert("Error", err.message, "❌");
                    btn.textContent = 'Add Drug'; btn.disabled = false;
                });
            });

            db.collection('inventory').orderBy('name').onSnapshot(snapshot => {
                globalInventory = [];
                posDrugSelect.innerHTML = '<option value="">Select drug...</option>';
                
                if (snapshot.empty) {
                    inventoryContainer.innerHTML = `<p style="text-align: center; width: 100%; color:#888;">No drugs in inventory.</p>`;
                    return;
                }
                
                inventoryContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    globalInventory.push({ id: doc.id, ...d });
                    
                    // Populate POS Dropdown
                    posDrugSelect.innerHTML += `<option value="${doc.id}">${d.name} - ₦${d.price} (${d.stock} left)</option>`;

                    const badgeClass = d.stock > 10 ? 'status-complete' : 'status-pending';
                    inventoryContainer.innerHTML += `
                        <div class="data-card" style="border-left: 4px solid #10b981;">
                            <div class="data-card-header">
                                <span class="data-id">${d.name}</span>
                                <span class="data-date">₦${d.price.toLocaleString()}</span>
                            </div>
                            <div class="data-info" style="margin-top:10px; background:#fff;">
                                <strong>Stock Available:</strong> <span class="status-badge ${badgeClass}">${d.stock} units</span>
                            </div>
                        </div>
                    `;
                });
            });
            // --- END OF INVENTORY MANAGEMENT LOGIC ---

            loadInitialPrescriptions();
        });
        // --- END OF PHARMACY INITIALIZATION ---
    </script>
</body>
</html>
