<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💊 Pharmacy</h1>
                <p>Dispense medications based on doctor consultations.</p>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Prescription Queue</h3>
            <table>
                <thead>
                    <tr>
                        <th>Patient (P ID)</th>
                        <th>Requested By</th>
                        <th>Prescription</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pharmacyTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading prescriptions...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js?v=106"></script>

    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = '../login.html'; return; }

            const tbody = document.getElementById('pharmacyTableBody');

            // Load Prescriptions (Manual Sort to avoid index issues)
            db.collection('prescriptions').onSnapshot((snapshot) => {
                tbody.innerHTML = '';
                let hasPending = false;
                let prescriptions = [];

                snapshot.forEach(doc => prescriptions.push({ id: doc.id, ...doc.data() }));
                
                // Sort newest first
                prescriptions.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                prescriptions.forEach(d => {
                    if (d.status === 'Pending') {
                        hasPending = true;
                        const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                        
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${d.patientName}</strong><br><small style="color:#2563eb;">${d.patientId}</small></td>
                                <td>${d.doctorName || 'Doctor'} <br><small>ID: ${d.doctorStaffId || 'N/A'}</small></td>
                                <td style="color: #2563eb; font-weight: bold;">${d.medication}</td>
                                <td>${date}</td>
                                <td><span class="status-badge status-pending">Pending</span></td>
                                <td>
                                    <button class="btn btn-primary" onclick="dispenseDrug('${d.id}')">Dispense</button>
                                </td>
                            </tr>
                        `;
                    }
                });

                if (!hasPending) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No pending prescriptions in the queue.</td></tr>`;
                }
            });

            window.dispenseDrug = function(id) {
                if(confirm("Have you dispensed these drugs?")) {
                    db.collection('prescriptions').doc(id).update({
                        status: 'Dispensed'
                    }).then(() => {
                        logActivity(auth.currentUser, "Dispensed Drugs", `Prescription ID: ${id}`);
                        alert('Dispensed successfully!');
                    }).catch((error) => alert("Error: " + error.message));
                }
            };
        });
    </script>
</body>
</html>
