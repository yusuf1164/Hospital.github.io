<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container" style="max-width: 900px;">
            <div class="page-header">
                <h1>🗂️ Medical Records</h1>
                <p>View complete patient history across all departments.</p>
            </div>

            <!-- BACK TO DASHBOARD BUTTON -->
            <a href="../dashboard.html" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block;">⬅️ Back to Dashboard</a>

            <!-- Search Patient -->
            <div class="form-card" style="margin-bottom: 30px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Search Patient (Name, ID, or Phone)</label>
                    <div class="autocomplete-container">
                        <input type="text" id="searchPatientInput" placeholder="Type to search..." autocomplete="off">
                        <div id="autocompleteList" class="autocomplete-list"></div>
                        <input type="hidden" id="selectedPatientId">
                    </div>
                </div>
            </div>

            <!-- Patient History Container (Hidden by default) -->
            <div id="historyContainer" style="display: none;">
                <div class="record-block"><h3>🌡️ Nursing Vitals</h3><div id="vitalsList"></div></div>
                <div class="record-block"><h3>🩺 OPD Consultations</h3><div id="consultationsList"></div></div>
                <div class="record-block"><h3>🧪 Laboratory Results</h3><div id="labsList"></div></div>
                <div class="record-block"><h3>🩻 Radiology Scans</h3><div id="radiologyList"></div></div>
                <div class="record-block"><h3>💳 Billing History</h3><div id="billingList"></div></div>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
    // --- START OF RECORDS INITIALIZATION ---
    enforceAuth(['records', 'doctor', 'admin', 'nurse']);

    auth.onAuthStateChanged((user) => {
        if (!user) return;

        const searchInput = document.getElementById('searchPatientInput');
        const autocompleteList = document.getElementById('autocompleteList');
        const hiddenPatientId = document.getElementById('selectedPatientId');
        const historyContainer = document.getElementById('historyContainer');
        let debounceTimer;

        // --- START OF SCALABLE SERVER-SIDE SEARCH ---
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            clearTimeout(debounceTimer);
            hiddenPatientId.value = "";
            historyContainer.style.display = 'none';
            autocompleteList.style.display = 'none';

            if (term.length < 2) return; 

            debounceTimer = setTimeout(async () => {
                autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">Searching...</div>';
                autocompleteList.style.display = 'block';

                let results = [];
                let seenIds = new Set();
                const upperTerm = term.toUpperCase();

                // 1. SEARCH BY EXACT ID (This will almost always succeed)
                try {
                    const idQuery = await db.collection('patients').where('patientId', '==', upperTerm).get();
                    idQuery.forEach(doc => {
                        results.push({ firestoreId: doc.id, ...doc.data() });
                        seenIds.add(doc.id);
                    });
                } catch (err) {
                    console.error("ID Search Error:", err);
                }

                // 2. SEARCH BY NAME (This might fail if you haven't created an index yet)
                try {
                    const searchTerm = term.charAt(0).toUpperCase() + term.slice(1).toLowerCase();
                    const nameQuery = await db.collection('patients')
                        .orderBy('firstName')
                        .startAt(searchTerm)
                        .endAt(searchTerm + '\uf8ff')
                        .limit(10)
                        .get();
                        
                    nameQuery.forEach(doc => {
                        if (!seenIds.has(doc.id)) {
                            results.push({ firestoreId: doc.id, ...doc.data() });
                            seenIds.add(doc.id);
                        }
                    });
                } catch (err) {
                    console.error("Name Search Error (Index might be missing):", err);
                }

                // 3. RENDER RESULTS
                renderDropdown(results);
            }, 300); 
        });

        function renderDropdown(patients) {
            autocompleteList.innerHTML = '';
            if (patients.length === 0) { 
                autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">No matching patients found.</div>';
                return; 
            }
            
            patients.forEach(p => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                div.addEventListener('click', () => {
                    searchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                    hiddenPatientId.value = p.patientId; 
                    autocompleteList.style.display = 'none';
                    loadPatientHistory(p.patientId);
                });
                autocompleteList.appendChild(div);
            });
        }

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none';
        });
        // --- END OF SCALABLE SERVER-SIDE SEARCH ---

        // --- START OF LOAD PATIENT HISTORY ---
        function loadPatientHistory(patientIdString) {
            historyContainer.style.display = 'block';

            const sections = ['vitalsList', 'consultationsList', 'labsList', 'radiologyList', 'billingList'];
            sections.forEach(id => document.getElementById(id).innerHTML = '<p style="color:#888;">Loading records...</p>');

            Promise.all([
                db.collection('vitals').where('patientId', '==', patientIdString).get(),
                db.collection('consultations').where('patientId', '==', patientIdString).get(),
                db.collection('labResults').where('patientId', '==', patientIdString).get(),
                db.collection('radiology').where('patientId', '==', patientIdString).get(),
                db.collection('bills').where('patientId', '==', patientIdString).get()
            ]).then(([vitalsSnap, consultSnap, labsSnap, radSnap, billsSnap]) => {
                
                const formatDate = (ts) => ts ? ts.toDate().toLocaleString(undefined, { 
                    year: 'numeric', month: 'short', day: 'numeric', 
                    hour: '2-digit', minute: '2-digit', hour12: true 
                }) : 'N/A';

                let vitalsHTML = '';
                if (vitalsSnap.empty) vitalsHTML = '<p style="color:#888;">No vitals recorded.</p>';
                vitalsSnap.forEach(doc => {
                    const d = doc.data();
                    vitalsHTML += `<div class="record-item"><span class="record-date">${formatDate(d.createdAt)}</span> <strong>BP:</strong> ${d.bp} | <strong>Temp:</strong> ${d.temp}°C | <strong>Weight:</strong> ${d.weight}kg | <strong>Pulse:</strong> ${d.pulse} bpm</div>`;
                });
                document.getElementById('vitalsList').innerHTML = vitalsHTML;

                let consultHTML = '';
                if (consultSnap.empty) consultHTML = '<p style="color:#888;">No consultations recorded.</p>';
                consultSnap.forEach(doc => {
                    const d = doc.data();
                    consultHTML += `
                        <div class="record-item">
                            <span class="record-date">${formatDate(d.createdAt)}</span>
                            <strong>Doctor:</strong> ${d.doctorName || 'Unknown'}<br>
                            <strong>Symptoms:</strong> ${d.symptoms}<br>
                            <strong>Diagnosis:</strong> ${d.diagnosis}
                        </div>`;
                });
                document.getElementById('consultationsList').innerHTML = consultHTML;

                let labsHTML = '';
                if (labsSnap.empty) labsHTML = '<p style="color:#888;">No lab tests recorded.</p>';
                labsSnap.forEach(doc => {
                    const d = doc.data();
                    const res = d.status === 'Completed' ? `<strong>Result:</strong> ${d.result}` : '<span style="color:#dc2626;">Pending</span>';
                    labsHTML += `<div class="record-item"><span class="record-date">${formatDate(d.createdAt)}</span> <strong>${d.testType}</strong> - ${res}</div>`;
                });
                document.getElementById('labsList').innerHTML = labsHTML;

                let radHTML = '';
                if (radSnap.empty) radHTML = '<p style="color:#888;">No scans recorded.</p>';
                radSnap.forEach(doc => {
                    const d = doc.data();
                    const res = d.status === 'Completed' ? `<strong>Findings:</strong> ${d.result}` : '<span style="color:#dc2626;">Pending</span>';
                    radHTML += `<div class="record-item"><span class="record-date">${formatDate(d.createdAt)}</span> <strong>${d.scanType}</strong> - ${res}</div>`;
                });
                document.getElementById('radiologyList').innerHTML = radHTML;

                let billsHTML = '';
                if (billsSnap.empty) billsHTML = '<p style="color:#888;">No bills recorded.</p>';
                billsSnap.forEach(doc => {
                    const d = doc.data();
                    const badge = d.status === 'Paid' ? '<span class="status-badge status-complete">Paid</span>' : '<span class="status-badge status-pending">Pending</span>';
                    billsHTML += `<div class="record-item"><span class="record-date">${formatDate(d.createdAt)}</span> <strong>${d.service}</strong> - ₦${Number(d.amount).toLocaleString()} ${badge}</div>`;
                });
                document.getElementById('billingList').innerHTML = billsHTML;

            }).catch(err => {
                showAlert("Error", "Error fetching records: " + err.message, "❌");
            });
        }
        // --- END OF LOAD PATIENT HISTORY ---
    });
    // --- END OF RECORDS INITIALIZATION ---
</script>
</body>
</html>
