<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wards & Rooms - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🛏️ Wards & Rooms</h1>
                <p>Manage patient admissions, beds, and nurse assignments.</p>
            </div>
            
            <div id="roomGridContainer" class="room-grid">
                <p style="text-align: center; width: 100%; color: #888;">Loading rooms...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <!-- MODAL: Assign Patient -->
    <div id="assignPatientModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Assign Patient to Bed</h3>
            <input type="hidden" id="modalRoomId">
            <input type="hidden" id="modalBedNo">
            <div class="form-group">
                <label>Search Patient</label>
                <div class="autocomplete-container">
                    <input type="text" id="wardPatientSearch" placeholder="Type Name or P ID..." autocomplete="off">
                    <div id="wardAutocompleteList" class="autocomplete-list"></div>
                    <input type="hidden" id="selectedWardPatientId">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="closeModal('assignPatientModal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmAssignPatient()">Assign</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Manage Nurses -->
    <div id="manageNursesModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Manage Nurses for <span id="nurseModalRoomName"></span></h3>
            <input type="hidden" id="nurseModalRoomId">
            <div id="nurseListContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;"></div>
            <button class="btn btn-outline" style="width: 100%; margin-top: 20px; border-color: #ccc; color: #333;" onclick="closeModal('manageNursesModal')">Close</button>
        </div>
    </div>

    <!-- NEW MODAL: Update Patient Status -->
    <div id="updateStatusModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Update Patient Status</h3>
            <p style="margin-bottom: 15px; font-size: 14px;">Patient: <strong id="statusPatientName"></strong></p>
            <input type="hidden" id="statusRoomId">
            <input type="hidden" id="statusBedNo">
            
            <div class="form-group">
                <label>Select New Status</label>
                <select id="newPatientStatus">
                    <option value="Stable">Stable</option>
                    <option value="Critical">Critical</option>
                    <option value="Discharged">Discharged (Frees Bed)</option>
                    <option value="Deceased">Deceased (Frees Bed)</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="closeModal('updateStatusModal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmUpdateStatus()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['admin', 'doctor', 'nurse', 'reception']);
        let allPatients = [];
        let currentRooms = [];

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            // Fetch Patients once
            db.collection('patients').get().then(snap => {
                snap.forEach(doc => allPatients.push(doc.data()));
            });

            // Load Rooms Real-time
            db.collection('rooms').orderBy('roomNo').onSnapshot(snap => {
                currentRooms = [];
                snap.forEach(doc => currentRooms.push({ id: doc.id, ...doc.data() }));
                renderRooms();
            });
        });

        function renderRooms() {
            const container = document.getElementById('roomGridContainer');
            if (currentRooms.length === 0) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">No rooms created yet. Go to Admin Panel to create rooms.</p>';
                return;
            }

            container.innerHTML = '';
            currentRooms.forEach(room => {
                let bedsHtml = '';
                room.beds.forEach(bed => {
                    const isOccupied = bed.patientId !== null;
                    const bedClass = isOccupied ? 'bed-occupied' : 'bed-empty';
                    
                    let actionHtml = '';
                    if (isOccupied) {
                        actionHtml = `
                            <div style="text-align:right;">
                                <span class="status-badge ${bed.status === 'Critical' ? 'status-pending' : 'status-active'}" style="margin-bottom:5px;">${bed.status || 'Stable'}</span><br>
                                <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; border-color: #1e3a8a; color: #1e3a8a;" onclick="openUpdateStatus('${room.id}', ${bed.bedNo}, '${bed.patientName}')">Update</button>
                            </div>
                        `;
                    } else {
                        actionHtml = `<button class="btn btn-primary" style="padding: 4px 8px; font-size: 12px;" onclick="openAssignPatient('${room.id}', ${bed.bedNo})">Assign Patient</button>`;
                    }

                    bedsHtml += `
                        <div class="bed-item ${bedClass}">
                            <div class="bed-info">
                                <strong>Bed ${bed.bedNo}</strong>
                                ${isOccupied ? `<span>${bed.patientName} (${bed.patientId})</span>` : '<span>Empty</span>'}
                            </div>
                            ${actionHtml}
                        </div>
                    `;
                });

                let nursesHtml = 'No nurses assigned.';
                if (room.nurses && room.nurses.length > 0) {
                    nursesHtml = 'Nurses: ' + room.nurses.map(n => n.name).join(', ');
                }

                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-header">
                            <div class="room-title">Room ${room.roomNo} - ${room.roomName}</div>
                            <button class="btn btn-outline" style="padding: 4px 8px; font-size: 12px; border-color: #8b5cf6; color: #8b5cf6;" onclick="openManageNurses('${room.id}', '${room.roomName}')">Manage Nurses</button>
                        </div>
                        <div class="room-nurses">${nursesHtml}</div>
                        <div class="beds-container">${bedsHtml}</div>
                    </div>
                `;
            });
        }

        window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; };

        // --- 1. ASSIGN PATIENT MODAL ---
        window.openAssignPatient = function(roomId, bedNo) {
            document.getElementById('modalRoomId').value = roomId;
            document.getElementById('modalBedNo').value = bedNo;
            document.getElementById('wardPatientSearch').value = '';
            document.getElementById('selectedWardPatientId').value = '';
            document.getElementById('assignPatientModal').style.display = 'flex';
        };

        const wardSearchInput = document.getElementById('wardPatientSearch');
        const wardAutocompleteList = document.getElementById('wardAutocompleteList');
        
        wardSearchInput.addEventListener('focus', () => renderWardDropdown(allPatients));
        wardSearchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.getElementById('selectedWardPatientId').value = "";
            const filtered = allPatients.filter(p => {
                const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                const pid = String(p.patientId).toLowerCase();
                return name.includes(term) || pid.includes(term);
            });
            renderWardDropdown(filtered);
        });

        function renderWardDropdown(patients) {
            wardAutocompleteList.innerHTML = '';
            if (patients.length === 0) { wardAutocompleteList.style.display = 'none'; return; }
            patients.forEach(p => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                div.addEventListener('click', () => {
                    wardSearchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                    document.getElementById('selectedWardPatientId').value = p.patientId;
                    document.getElementById('wardPatientSearch').dataset.name = `${p.firstName} ${p.lastName}`;
                    wardAutocompleteList.style.display = 'none';
                });
                wardAutocompleteList.appendChild(div);
            });
            wardAutocompleteList.style.display = 'block';
        }

        window.confirmAssignPatient = function() {
            const roomId = document.getElementById('modalRoomId').value;
            const bedNo = parseInt(document.getElementById('modalBedNo').value);
            const patientId = document.getElementById('selectedWardPatientId').value;
            const patientName = document.getElementById('wardPatientSearch').dataset.name;

            if (!patientId) { alert("Please select a patient from the dropdown."); return; }

            const room = currentRooms.find(r => r.id === roomId);
            let updatedBeds = room.beds.map(b => {
                if (b.bedNo === bedNo) {
                    return { bedNo: b.bedNo, patientId: patientId, patientName: patientName, status: 'Stable' };
                }
                return b;
            });

            db.collection('rooms').doc(roomId).update({ beds: updatedBeds }).then(() => {
                logActivity(auth.currentUser, "Assigned Bed", `Patient ${patientName} to Room ${room.roomNo} Bed ${bedNo}`);
                closeModal('assignPatientModal');
            }).catch(err => alert(err.message));
        };

        // --- 2. UPDATE STATUS MODAL ---
        window.openUpdateStatus = function(roomId, bedNo, patientName) {
            document.getElementById('statusRoomId').value = roomId;
            document.getElementById('statusBedNo').value = bedNo;
            document.getElementById('statusPatientName').textContent = patientName;
            document.getElementById('newPatientStatus').value = 'Stable'; // Reset to default
            document.getElementById('updateStatusModal').style.display = 'flex';
        };

        window.confirmUpdateStatus = function() {
            const roomId = document.getElementById('statusRoomId').value;
            const bedNo = parseInt(document.getElementById('statusBedNo').value);
            const newStatus = document.getElementById('newPatientStatus').value;

            const room = currentRooms.find(r => r.id === roomId);
            let updatedBeds = room.beds.map(b => {
                if (b.bedNo === bedNo) {
                    // If discharged or deceased, clear the bed
                    if (newStatus === 'Discharged' || newStatus === 'Deceased') {
                        return { bedNo: b.bedNo, patientId: null, patientName: null, status: 'Empty' };
                    } else {
                        return { bedNo: b.bedNo, patientId: b.patientId, patientName: b.patientName, status: newStatus };
                    }
                }
                return b;
            });

            db.collection('rooms').doc(roomId).update({ beds: updatedBeds }).then(() => {
                logActivity(auth.currentUser, "Updated Bed Status", `${room.beds.find(b=>b.bedNo===bedNo).patientName} marked as ${newStatus}`);
                closeModal('updateStatusModal');
            }).catch(err => alert(err.message));
        };

        // --- 3. MANAGE NURSES MODAL ---
        window.openManageNurses = function(roomId, roomName) {
            document.getElementById('nurseModalRoomId').value = roomId;
            document.getElementById('nurseModalRoomName').textContent = roomName;
            const container = document.getElementById('nurseListContainer');
            
            container.innerHTML = '<p style="text-align: center; color: #888;">Loading nurses...</p>';

            // Fetch fresh list of nurses every time the modal opens
            db.collection('users').get().then(snap => {
                let allNurses = [];
                snap.forEach(doc => {
                    const u = doc.data();
                    if (u.roles && u.roles.includes('nurse')) allNurses.push(u);
                });

                container.innerHTML = '';
                if (allNurses.length === 0) {
                    container.innerHTML = '<p>No users with the "nurse" role found. Please assign the role in the Admin Panel.</p>';
                    return;
                }

                const room = currentRooms.find(r => r.id === roomId);
                allNurses.forEach(nurse => {
                    const isAssigned = room.nurses && room.nurses.some(n => n.id === nurse.staffId);
                    const btnClass = isAssigned ? 'btn-outline' : 'btn-primary';
                    const btnText = isAssigned ? 'Unassign' : 'Assign';
                    const btnStyle = isAssigned ? 'border-color: #dc2626; color: #dc2626;' : '';
                    
                    container.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #e5e7eb; border-radius: 5px;">
                            <div><strong>${nurse.firstName} ${nurse.lastName}</strong> (ID: ${nurse.staffId})</div>
                            <button class="btn ${btnClass}" style="padding: 5px 10px; font-size: 12px; ${btnStyle}" onclick="toggleNurse('${roomId}', '${nurse.staffId}', '${nurse.firstName} ${nurse.lastName}', ${isAssigned})">${btnText}</button>
                        </div>
                    `;
                });
            }).catch(err => {
                container.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
            });

            document.getElementById('manageNursesModal').style.display = 'flex';
        };

        window.toggleNurse = function(roomId, nurseId, nurseName, isAssigned) {
            const action = isAssigned ? 'unassign' : 'assign';
            if (!confirm(`Are you sure you want to ${action} Nurse ${nurseName}?`)) return;

            const room = currentRooms.find(r => r.id === roomId);
            let updatedNurses = room.nurses || [];

            if (isAssigned) {
                updatedNurses = updatedNurses.filter(n => n.id !== nurseId);
            } else {
                updatedNurses.push({ id: nurseId, name: nurseName });
            }

            db.collection('rooms').doc(roomId).update({ nurses: updatedNurses }).then(() => {
                logActivity(auth.currentUser, "Nurse Assignment", `${nurseName} ${action}ed to Room ${room.roomNo}`);
                // Refresh the list instantly without closing the modal
                openManageNurses(roomId, room.roomName); 
            }).catch(err => alert(err.message));
        };
    </script>
</body>
</html>
