<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient List - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>👥 Patient List</h1>
                <p>Search and view all registered patients.</p>
            </div>

            <!-- Search Bar -->
            <input type="text" id="searchPatient" class="search-box" placeholder="Search by Patient ID, Name, or Phone Number...">

            <!-- Patient Table -->
            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Date Registered</th>
                    </tr>
                </thead>
                <tbody id="patientListBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading patients...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // 1. APPLY THE GUARD
        enforceAuth(['reception', 'doctor', 'nurse', 'admin', 'records']);

        // 2. PAGE LOGIC
        let allPatients = []; 

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const tbody = document.getElementById('patientListBody');
            const searchInput = document.getElementById('searchPatient');

            // Fetch all patients
            db.collection('patients').onSnapshot((snapshot) => {
                allPatients = []; 
                snapshot.forEach(doc => {
                    allPatients.push({ firestoreId: doc.id, ...doc.data() });
                });

                // Manually sort by createdAt in JavaScript (Newest first)
                allPatients.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                renderTable(allPatients);
            }, error => {
                // Catch errors so it doesn't freeze
                console.error("Firestore Error: ", error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Database Error: ${error.message}</td></tr>`;
            });

            // Search Logic
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allPatients.filter(p => {
                    const pId = String(p.patientId || '').toLowerCase();
                    const name = `${p.firstName || ''} ${p.lastName || ''}`.toLowerCase();
                    const phone = String(p.phone || '').toLowerCase();
                    
                    return pId.includes(term) || name.includes(term) || phone.includes(term);
                });
                renderTable(filtered);
            });

            // Render Table Function
            function renderTable(patients) {
                if (patients.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No patients found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                patients.forEach(p => {
                    const date = p.createdAt ? p.createdAt.toDate().toLocaleDateString() : 'Just now';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${p.patientId || 'N/A'}</strong></td>
                            <td><strong>${p.firstName} ${p.lastName}</strong></td>
                            <td>${p.age}</td>
                            <td>${p.gender}</td>
                            <td>${p.phone}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            }
        });
    </script>
</body>
</html>
