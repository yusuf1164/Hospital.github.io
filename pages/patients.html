<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient List - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>👥 Patient List</h1>
                <p>Search and view registered patients.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <!-- Search Bar -->
            <input type="text" id="searchPatient" class="search-box" placeholder="Search by Name, P ID, or Phone..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #1e3a8a; border-radius: 5px; font-size: 16px;">

            <!-- Patient Cards Container -->
            <div id="patientCardContainer" class="card-grid-layout">
                <p style="text-align: center; width: 100%; color: #888;">Loading patients...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF PATIENT LIST INITIALIZATION ---
        enforceAuth(['reception', 'doctor', 'nurse', 'admin', 'records']);

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const cardContainer = document.getElementById('patientCardContainer');
            const searchInput = document.getElementById('searchPatient');
            let debounceTimer;

            // --- START OF INITIAL FETCH (SCALABLE) ---
            function loadInitialPatients() {
                cardContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">Loading patients...</p>';
                
                db.collection('patients').orderBy('createdAt', 'desc').limit(20).get().then(snapshot => {
                    if (snapshot.empty) {
                        cardContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">No patients found.</p>';
                        return;
                    }
                    
                    let patients = [];
                    snapshot.forEach(doc => patients.push({ firestoreId: doc.id, ...doc.data() }));
                    renderPatientCards(patients);
                }).catch(error => {
                    cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color: red;">Error: ${error.message}</p>`;
                });
            }
            // --- END OF INITIAL FETCH ---

            // --- START OF FOOLPROOF SERVER-SIDE SEARCH ---
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim().toLowerCase();
                clearTimeout(debounceTimer);

                if (term === "") {
                    loadInitialPatients(); 
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    cardContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">Searching...</p>';
                    let results = [];
                    let seenIds = new Set();
                    const searchTerm = term.charAt(0).toUpperCase() + term.slice(1); 
                    const upperTerm = term.toUpperCase();

                    try {
                        const idSnap = await db.collection('patients').where('patientId', '==', upperTerm).get();
                        idSnap.forEach(doc => { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); });
                    } catch (err) { console.error(err); }

                    try {
                        const firstSnap = await db.collection('patients').orderBy('firstName').startAt(searchTerm).endAt(searchTerm + '\uf8ff').limit(10).get();
                        firstSnap.forEach(doc => { if (!seenIds.has(doc.id)) { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); } });
                    } catch (err) { console.error(err); }

                    try {
                        const lastSnap = await db.collection('patients').orderBy('lastName').startAt(searchTerm).endAt(searchTerm + '\uf8ff').limit(10).get();
                        lastSnap.forEach(doc => { if (!seenIds.has(doc.id)) { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); } });
                    } catch (err) { console.error(err); }

                    try {
                        const recentPatients = await db.collection('patients').orderBy('createdAt', 'desc').limit(50).get();
                        recentPatients.forEach(doc => {
                            if (seenIds.has(doc.id)) return; 
                            const p = doc.data();
                            const fullName = `${p.firstName} ${p.lastName}`.toLowerCase();
                            const phoneStr = String(p.phone || '').toLowerCase();
                            if (fullName.includes(term) || phoneStr.includes(term)) {
                                results.push({ firestoreId: doc.id, ...p });
                                seenIds.add(doc.id);
                            }
                        });
                    } catch (err) { console.error(err); }

                    if (results.length === 0) {
                        cardContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">No matching patients found.</p>';
                    } else {
                        results.sort((a, b) => {
                            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                            return timeB - timeA;
                        });
                        renderPatientCards(results);
                    }
                }, 600); 
            });
            // --- END OF FOOLPROOF SERVER-SIDE SEARCH ---

            // --- START OF RENDER CARDS ---
            function renderPatientCards(patients) {
                if (patients.length === 0) {
                    cardContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #888;">No patients found.</p>';
                    return;
                }

                cardContainer.innerHTML = '';
                patients.forEach(p => {
                    const dateStr = p.createdAt ? p.createdAt.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'Just now';

                    cardContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header">
                                <span class="data-id">${p.patientId || 'N/A'}</span>
                                <span class="data-date">${dateStr}</span>
                            </div>
                            <div class="data-name">${p.firstName} ${p.lastName}</div>
                            <div class="data-info">
                                <strong>Age:</strong> ${p.age || 'N/A'} | <strong>Gender:</strong> ${p.gender || 'N/A'}<br>
                                <strong>Religion:</strong> ${p.religion || 'N/A'}<br>
                                <strong>Phone:</strong> ${p.phone || 'N/A'}
                            </div>
                            <div class="data-action" style="justify-content: space-between; align-items: center;">
                                <!-- NEW VIEW PIN BUTTON -->
                                <button class="btn btn-outline" style="padding: 6px 10px; font-size: 12px; border-color: #f59e0b; color: #f59e0b;" onclick="viewPin('${p.pin || ''}', '${p.firstName} ${p.lastName}')">🔑 View PIN</button>
                                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="window.location.href='records.html?id=${p.patientId}'">View Records</button>
                            </div>
                        </div>
                    `;
                });
            }
            // --- END OF RENDER CARDS ---

            // --- START OF VIEW PIN MODAL LOGIC ---
            window.viewPin = function(pin, patientName) {
                if (!pin) {
                    showAlert("No PIN Found", "This patient does not have a security PIN saved in the system.", "⚠️");
                    return;
                }
                
                showAlert(
                    "Patient Security PIN", 
                    `The Linking PIN for <strong>${patientName}</strong> is:<br><br>
                    <h1 style="color: #1e3a8a; font-size: 40px; letter-spacing: 8px; margin: 10px 0;">${pin}</h1>
                    Please write this down or give it to the patient so they can link their online portal.`, 
                    "🔑"
                );
            };
            // --- END OF VIEW PIN MODAL LOGIC ---

            loadInitialPatients();
        });
        // --- END OF PATIENT LIST INITIALIZATION ---
    </script>
</body>
</html>
