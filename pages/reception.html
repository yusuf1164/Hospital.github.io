<script>
    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.href = '../login.html'; return; }

        // 1. Load Patients into Table
        db.collection('patients').orderBy('createdAt', 'desc').limit(20).onSnapshot((snapshot) => {
            const tbody = document.getElementById('receptionTableBody');
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No patients registered yet.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                tbody.innerHTML += `
                    <tr>
                        <td>${doc.id.slice(0, 8)}...</td>
                        <td>${d.firstName} ${d.lastName}</td>
                        <td>${d.age}</td>
                        <td>${d.gender}</td>
                        <td>${d.phone}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        });

        // 2. Handle Form Submission
        const form = document.getElementById('receptionForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('formError');
            btn.textContent = 'Registering...'; btn.disabled = true;

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            db.collection('patients').add({
                firstName: firstName,
                lastName: lastName,
                age: age,
                gender: gender,
                phone: phone,
                address: address,
                registeredBy: user.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                logActivity(auth.currentUser, "Registered Patient", `Name: ${firstName} ${lastName}, Phone: ${phone}`); // <-- LOGGING ADDED
                alert('Patient Registered Successfully!');
                form.reset(); btn.textContent = 'Register Patient'; btn.disabled = false; errorDiv.style.display = 'none';
            })
            .catch((error) => {
                errorDiv.style.display = 'block'; errorDiv.textContent = "Error: " + error.message; btn.textContent = 'Register Patient'; btn.disabled = false;
            });
        });
    });
</script>
