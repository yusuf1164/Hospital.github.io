<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧑‍💼 Reception / Front Office</h1>
                <p>Register new patients and manage the hospital intake.</p>
            </div>

            <div class="form-card">
                <h3>Register New Patient</h3>
                <form id="receptionForm">
                    <div class="form-grid">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required placeholder="Doe"></div>
                        
                        <!-- CHANGED TO DATE OF BIRTH -->
                        <div class="form-group"><label>Date of Birth</label><input type="date" id="dob" required></div>
                        
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required>
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="+1 (555) 000-0000"></div>
                        <div class="form-group"><label>Email Address (or Parent's Email)</label><input type="email" id="email" placeholder="patient@example.com"></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label>Address</label><input type="text" id="address" required placeholder="123 Main St"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Register Patient</button>
                    <div id="formError" class="error-message" style="margin-top: 10px;"></div>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Registrations</h3>
            <table>
                <thead><tr><th>Patient ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Date</th></tr></thead>
                <tbody id="receptionTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading patients...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['reception', 'admin']);
        auth.onAuthStateChanged((user) => {
            if (!user) return;

            db.collection('patients').orderBy('createdAt', 'desc').limit(5).onSnapshot((snapshot) => {
                const tbody = document.getElementById('receptionTableBody');
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No patients registered yet.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${d.patientId || 'N/A'}</strong></td>
                            <td>${d.firstName} ${d.lastName}</td>
                            <td>${d.age}</td>
                            <td>${d.gender}</td>
                            <td>${d.phone}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            });

            const form = document.getElementById('receptionForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const errorDiv = document.getElementById('formError');
                btn.textContent = 'Registering...'; btn.disabled = true;
                errorDiv.style.display = 'none';

                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const dob = document.getElementById('dob').value;
                const gender = document.getElementById('gender').value;
                const phone = document.getElementById('phone').value;
                const email = document.getElementById('email').value;
                const address = document.getElementById('address').value;

                // Calculate Age automatically
                const birthDate = new Date(dob);
                const difference = Date.now() - birthDate.getTime();
                const ageDate = new Date(difference);
                const calculatedAge = Math.abs(ageDate.getUTCFullYear() - 1970);

                let generatedPatientId = "";
                let generatedPin = "";

                const counterRef = db.collection('settings').doc('counters');
                db.runTransaction((transaction) => {
                    return transaction.get(counterRef).then((doc) => {
                        let nextId = 1; 
                        if (doc.exists && doc.data().lastPatientId) {
                            nextId = doc.data().lastPatientId + 1;
                        }
                        transaction.set(counterRef, { lastPatientId: nextId }, { merge: true });
                        generatedPatientId = `P${String(nextId).padStart(4, '0')}`; 
                        generatedPin = Math.floor(100000 + Math.random() * 900000).toString();
                    });
                }).then(() => {
                    return db.collection('patients').add({
                        patientId: generatedPatientId,
                        pin: generatedPin, 
                        firstName: firstName,
                        lastName: lastName,
                        dob: dob, // Saving DOB
                        age: calculatedAge, // Saving calculated Age
                        gender: gender,
                        phone: phone,
                        email: email,
                        address: address,
                        registeredBy: user.uid,
                        treatmentStatus: 'Ongoing',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }).then(() => {
                    logActivity(auth.currentUser, "Registered Patient", `ID: ${generatedPatientId}, Name: ${firstName} ${lastName}`);
                    alert(`✔️ Patient Registered!\n\nPatient ID: ${generatedPatientId}\nSecurity PIN: ${generatedPin}\n\nPlease give this ID and PIN to the patient.`);
                    form.reset(); 
                    btn.textContent = 'Register Patient'; 
                    btn.disabled = false; 
                }).catch((error) => {
                    errorDiv.style.display = 'block'; 
                    errorDiv.textContent = "Error: " + error.message; 
                    btn.textContent = 'Register Patient'; 
                    btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
