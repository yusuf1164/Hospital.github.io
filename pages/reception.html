<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧑‍💼 Reception / Front Office</h1>
                <p>Register new patients and manage the hospital intake.</p>
            </div>

            <!-- Registration Form -->
            <div class="form-card">
                <h3>Register New Patient</h3>
                <form id="receptionForm">
                    <div class="form-grid">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required placeholder="Doe"></div>
                        <div class="form-group"><label>Age</label><input type="number" id="age" required placeholder="30"></div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required>
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="+1 (555) 000-0000"></div>
                        <div class="form-group"><label>Address</label><input type="text" id="address" required placeholder="123 Main St"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Register Patient</button>
                    <div id="formError" class="error-message" style="margin-top: 10px;"></div>
                </form>
            </div>

            <!-- Patient List -->
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Registrations</h3>
            <table>
                <thead><tr><th>Patient ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Date</th></tr></thead>
                <tbody id="receptionTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading patients...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <!-- Reception Logic -->
    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = '../login.html'; return; }

            // 1. Load Patients into Table
            db.collection('patients').orderBy('createdAt', 'desc').limit(20).onSnapshot((snapshot) => {
                const tbody = document.getElementById('receptionTableBody');
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No patients registered yet.</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                    tbody.innerHTML += `
                        <tr>
                            <td>${doc.id.slice(0, 8)}...</td>
                            <td>${d.firstName} ${d.lastName}</td>
                            <td>${d.age}</td>
                            <td>${d.gender}</td>
                            <td>${d.phone}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            });

            // 2. Handle Form Submission
            const form = document.getElementById('receptionForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const errorDiv = document.getElementById('formError');
                btn.textContent = 'Registering...'; btn.disabled = true;

                db.collection('patients').add({
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    age: document.getElementById('age').value,
                    gender: document.getElementById('gender').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    registeredBy: user.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    alert('Patient Registered Successfully!');
                    .then(() => {
                     logActivity(auth.currentUser, "Registered Patient", `Patient: ${firstName} ${lastName}`); // <-- ADD THIS
                    alert('Patient Registered Successfully!');
                    // ... rest of code
})
                    form.reset(); btn.textContent = 'Register Patient'; btn.disabled = false; errorDiv.style.display = 'none';
                })
                .catch((error) => {
                    errorDiv.style.display = 'block'; errorDiv.textContent = "Error: " + error.message; btn.textContent = 'Register Patient'; btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
