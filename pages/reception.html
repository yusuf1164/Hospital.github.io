<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧑‍💼 Reception / Front Office</h1>
                <p>Register new patients and manage the hospital intake.</p>
            </div>

            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <!-- EDIT REQUESTS SECTION -->
            <div id="editRequestsSection" class="form-card" style="display: none; border-left: 4px solid #f59e0b; margin-bottom: 30px;">
                <h3>Pending Name Edit Requests</h3>
                <div id="editRequestsContainer"></div>
            </div>

            <div class="form-card">
                <h3>Register New Patient</h3>
                <form id="receptionForm">
                    <div class="form-grid">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required placeholder="Doe"></div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="dob" required>
                            <div id="ageDisplay" style="font-size: 12px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div>
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required><option value="">Select...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
                        </div>
                        <div class="form-group">
                            <label>Religion</label>
                            <select id="religion" required><option value="">Select...</option><option value="Islam">Islam</option><option value="Christianity">Christianity</option><option value="Other">Other</option></select>
                        </div>
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="+1 (555) 000-0000"></div>
                        <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="patient@example.com"></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label>Address</label><input type="text" id="address" required placeholder="123 Main St"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Register Patient</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Registrations</h3>
            <div id="receptionCardContainer" class="card-grid-layout">
                <p style="text-align:center; width:100%; color:#888;">Loading patients...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF RECEPTION INITIALIZATION ---
        enforceAuth(['reception', 'admin']);
        
        document.getElementById('dob').addEventListener('change', function() {
            const age = calculateAge(this.value);
            document.getElementById('ageDisplay').textContent = age !== "" ? `Age: ${age}` : "";
        });

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const cardContainer = document.getElementById('receptionCardContainer');
            const editRequestsContainer = document.getElementById('editRequestsContainer');
            const editRequestsSection = document.getElementById('editRequestsSection');

            // 1. Load Edit Requests
            db.collection('editRequests').where('status', '==', 'Pending').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    editRequestsSection.style.display = 'none';
                    return;
                }
                
                editRequestsSection.style.display = 'block';
                editRequestsContainer.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const d = doc.data();
                    editRequestsContainer.innerHTML += `
                        <div style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>Patient ID: ${d.patientId}</strong><br>
                                <span style="font-size: 13px; color: #6b7280;">Requested Name: <strong>${d.requestedName}</strong></span>
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button class="btn btn-primary" style="padding: 5px 10px; font-size: 12px; background-color: #10b981;" onclick="approveEdit('${doc.id}', '${d.patientId}', '${d.requestedName.replace(/'/g, "\\'")}')">Approve</button>
                                <button class="btn btn-outline" style="padding: 5px 10px; font-size: 12px; border-color: #dc2626; color: #dc2626;" onclick="rejectEdit('${doc.id}')">Reject</button>
                            </div>
                        </div>
                    `;
                });
            });

            // Approve Function
            window.approveEdit = function(requestId, patientId, newName) {
                showConfirm("Approve Edit", `Change patient ${patientId}'s name to <strong>${newName}</strong>?`, () => {
                    // Split new name into first and last
                    const nameParts = newName.trim().split(' ');
                    const firstName = nameParts[0];
                    const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
                    
                    const batch = db.batch();

                    // Find the patient doc (Note: we need to query by patientId string, not doc ID)
                    db.collection('patients').where('patientId', '==', patientId).get().then(snap => {
                        if (!snap.empty) {
                            const patientDocId = snap.docs[0].id;
                            const patientRef = db.collection('patients').doc(patientDocId);
                            batch.update(patientRef, { firstName: firstName, lastName: lastName });
                        }

                        const requestRef = db.collection('editRequests').doc(requestId);
                        batch.update(requestRef, { status: 'Approved' });

                        return batch.commit();
                    }).then(() => {
                        logActivity(auth.currentUser, "Approved Edit", `Patient ${patientId} name changed to ${newName}`);
                        showAlert("Success", "Name updated successfully!", "✔️");
                    }).catch(err => showAlert("Error", err.message, "❌"));
                });
            };

            // Reject Function
            window.rejectEdit = function(requestId) {
                showConfirm("Reject Edit", "Are you sure you want to reject this name change request?", () => {
                    db.collection('editRequests').doc(requestId).update({ status: 'Rejected' })
                    .then(() => showAlert("Success", "Request rejected.", "✔️"));
                });
            };

            // 2. Load Recent Patients
            db.collection('patients').orderBy('createdAt', 'desc').limit(10).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    cardContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No patients registered yet.</p>`;
                    return;
                }
                cardContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    cardContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header">
                                <span class="data-id">${d.patientId || 'N/A'}</span>
                                <span class="data-date">${date}</span>
                            </div>
                            <div class="data-name">${d.firstName} ${d.lastName}</div>
                            <div class="data-info">
                                <strong>Age:</strong> ${d.age} | <strong>Gender:</strong> ${d.gender}<br>
                                <strong>Phone:</strong> ${d.phone}
                            </div>
                        </div>
                    `;
                });
            });

            // 3. Handle New Registration
            const form = document.getElementById('receptionForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.textContent = 'Registering...'; btn.disabled = true;

                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const dob = document.getElementById('dob').value;
                const gender = document.getElementById('gender').value;
                const religion = document.getElementById('religion').value;
                const phone = document.getElementById('phone').value;
                const email = document.getElementById('email').value;
                const address = document.getElementById('address').value;
                const calculatedAge = calculateAge(dob);

                let generatedPatientId = "";
                let generatedPin = "";

                const counterRef = db.collection('settings').doc('counters');
                db.runTransaction((transaction) => {
                    return transaction.get(counterRef).then((doc) => {
                        let nextId = 1; 
                        if (doc.exists && doc.data().lastPatientId) nextId = doc.data().lastPatientId + 1;
                        transaction.set(counterRef, { lastPatientId: nextId }, { merge: true });
                        generatedPatientId = `P${String(nextId).padStart(4, '0')}`; 
                        generatedPin = Math.floor(100000 + Math.random() * 900000).toString();
                    });
                }).then(() => {
                    return db.collection('patients').add({
                        patientId: generatedPatientId, pin: generatedPin, 
                        firstName: firstName, lastName: lastName, dob: dob, age: calculatedAge, gender: gender, religion: religion,
                        phone: phone, email: email, address: address, registeredBy: user.uid, treatmentStatus: 'Ongoing',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }).then(() => {
                    logActivity(auth.currentUser, "Registered Patient", `ID: ${generatedPatientId}, Name: ${firstName} ${lastName}`);
                    showAlert("Success", `Patient Registered!<br><br>Patient ID: <strong>${generatedPatientId}</strong><br>PIN: <strong>${generatedPin}</strong><br><br>Please give this ID and PIN to the patient.`, "✔️");
                    form.reset(); document.getElementById('ageDisplay').textContent = '';
                    btn.textContent = 'Register Patient'; btn.disabled = false; 
                }).catch((error) => {
                    showAlert("Error", error.message, "❌"); btn.textContent = 'Register Patient'; btn.disabled = false;
                });
            });
        });
        // --- END OF RECEPTION INITIALIZATION ---
    </script>
</body>
</html>
