<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Activity Log - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>📜 System Activity Log</h1>
                <p>Monitor all staff actions across the hospital.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <!-- Logs Container -->
            <div id="logContainer" class="card-grid-layout">
                <p style="text-align: center; width: 100%; color:#888;">Loading logs...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF ACTIVITY LOG INITIALIZATION ---
        enforceAuth(['admin', 'hr']);

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const logContainer = document.getElementById('logContainer');

            // Load latest 50 logs to keep it scalable
            db.collection('auditLogs').orderBy('timestamp', 'desc').limit(50).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    logContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No activity recorded yet.</p>`;
                    return;
                }
                
                logContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.timestamp ? d.timestamp.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'Just now';

                    // COLOR BADGES BASED ON ACTION
                    let badgeColor = 'status-active';
                    if (d.action.includes('Registered')) badgeColor = 'status-complete';
                    if (d.action.includes('Dispensed') || d.action.includes('Paid')) badgeColor = 'status-pending';

                    // FIX: Prevent long random Firebase UIDs from showing as IDs
                    let displayId = d.staffId || 'N/A';
                    if (displayId.length > 10) displayId = 'N/A'; // Firebase UIDs are ~28 characters

                    logContainer.innerHTML += `
                        <div class="data-card" style="border-left: 4px solid #2563eb;">
                            <div class="data-card-header">
                                <span class="data-id">${d.staffName || 'Staff Member'} <small style="color:#6b7280; font-weight:normal;">(ID: ${displayId})</small></span>
                                <span class="data-date">${date}</span>
                            </div>
                            <div class="data-info">
                                <strong>Action:</strong> <span class="status-badge ${badgeColor}">${d.action}</span><br>
                                <strong>Details:</strong> ${d.details}
                            </div>
                        </div>
                    `;
                });
            }, error => {
                logContainer.innerHTML = `<p style="text-align:center; width:100%; color:red;">Error: ${error.message}</p>`;
            });
        });
        // --- END OF ACTIVITY LOG INITIALIZATION ---
    </script>
</body>
</html>
