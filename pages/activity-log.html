<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Activity Log - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>📜 System Activity Log</h1>
                <p>Monitor all staff actions across the hospital.</p>
            </div>

            <!-- BACK TO DASHBOARD BUTTON -->
            <a href="../dashboard.html" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block;">⬅️ Back to Dashboard</a>

            <!-- Logs Container -->
            <div id="logContainer">
                <p style="text-align: center; color:#888;">Loading logs...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF ACTIVITY LOG INITIALIZATION ---
        enforceAuth(['admin']);

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const logContainer = document.getElementById('logContainer');

            // Load latest 100 logs to keep it scalable
            db.collection('auditLogs').orderBy('timestamp', 'desc').limit(100).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    logContainer.innerHTML = `<p style="text-align:center; color:#888;">No activity recorded yet.</p>`;
                    return;
                }
                
                logContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.timestamp ? d.timestamp.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'Just now';

                    let badgeColor = 'status-active';
                    if (d.action.includes('Registered')) badgeColor = 'status-complete';
                    if (d.action.includes('Dispensed') || d.action.includes('Paid')) badgeColor = 'status-pending';

                    logContainer.innerHTML += `
                        <div class="log-card">
                            <div class="log-header">
                                <span class="log-staff">${d.staffName || 'Staff Member'} (ID: ${d.staffId || 'N/A'})</span>
                                <span class="log-date">${date}</span>
                            </div>
                            <div class="log-action"><span class="status-badge ${badgeColor}">${d.action}</span></div>
                            <div class="log-details">${d.details}</div>
                        </div>
                    `;
                });
            }, error => {
                logContainer.innerHTML = `<p style="text-align:center; color:red;">Error: ${error.message}</p>`;
            });
        });
        // --- END OF ACTIVITY LOG INITIALIZATION ---
    </script>
</body>
</html>
