<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treatment Status - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🏥 Patient Treatment Status</h1>
                <p>View and manage ongoing and treated patients.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>
            
            <!-- Filter Buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-primary filter-btn" data-filter="All" style="flex: 1;">All Patients</button>
                <button class="btn btn-outline filter-btn" data-filter="Ongoing" style="flex: 1; border-color: #1e3a8a; color: #1e3a8a;">Ongoing</button>
                <button class="btn btn-outline filter-btn" data-filter="Treated" style="flex: 1; border-color: #065f46; color: #065f46;">Treated</button>
            </div>

            <!-- TREATMENT CARDS CONTAINER -->
            <div id="treatmentCardContainer" class="treatment-grid">
                <p style="text-align: center; width: 100%; color: #888;">Loading patients...</p>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF TREATMENT LIST INITIALIZATION ---
        enforceAuth(['admin', 'doctor', 'nurse', 'reception', 'records']);
        let allPatients = [];
        let currentFilter = 'All';

        // Check URL parameters (e.g., ?status=Ongoing)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('status')) {
            currentFilter = urlParams.get('status');
        }

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const cardContainer = document.getElementById('treatmentCardContainer');

            // --- START OF SCALABLE INITIAL FETCH ---
            // We only fetch the 50 most recent patients to keep the page fast
            db.collection('patients').orderBy('createdAt', 'desc').limit(50).onSnapshot(snapshot => {
                allPatients = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    // If no status exists, assume it's ongoing
                    if (!d.treatmentStatus) d.treatmentStatus = 'Ongoing'; 
                    allPatients.push({ id: doc.id, ...d });
                });
                applyFilter(currentFilter);
            });
            // --- END OF SCALABLE INITIAL FETCH ---

            // --- START OF FILTER BUTTONS LOGIC ---
            document.querySelectorAll('.filter-btn').forEach(btn => {
                // Highlight the active filter button initially
                if (btn.getAttribute('data-filter') === currentFilter) {
                    btn.className = 'btn btn-primary filter-btn';
                } else {
                    btn.className = 'btn btn-outline filter-btn';
                    if (btn.getAttribute('data-filter') === 'Ongoing') btn.style.cssText = 'flex: 1; border-color: #1e3a8a; color: #1e3a8a;';
                    if (btn.getAttribute('data-filter') === 'Treated') btn.style.cssText = 'flex: 1; border-color: #065f46; color: #065f46;';
                }

                btn.addEventListener('click', (e) => {
                    currentFilter = e.target.getAttribute('data-filter');
                    window.history.pushState({}, '', `?status=${currentFilter}`);
                    applyFilter(currentFilter);
                    
                    // Reset button styles
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.className = 'btn btn-outline filter-btn';
                        if (b.getAttribute('data-filter') === 'Ongoing') b.style.cssText = 'flex: 1; border-color: #1e3a8a; color: #1e3a8a;';
                        if (b.getAttribute('data-filter') === 'Treated') b.style.cssText = 'flex: 1; border-color: #065f46; color: #065f46;';
                    });
                    // Highlight clicked
                    e.target.className = 'btn btn-primary filter-btn';
                    e.target.style.cssText = 'flex: 1;';
                });
            });
            // --- END OF FILTER BUTTONS LOGIC ---

            // --- START OF APPLY FILTER & RENDER CARDS ---
            function applyFilter(filter) {
                let filtered = allPatients;
                if (filter !== 'All') {
                    filtered = allPatients.filter(p => p.treatmentStatus === filter);
                }

                if (filtered.length === 0) {
                    cardContainer.innerHTML = `<p style="text-align: center; width: 100%; color: #888;">No ${filter} patients found.</p>`;
                    return;
                }

                cardContainer.innerHTML = '';
                filtered.forEach(p => {
                    const badgeClass = p.treatmentStatus === 'Treated' ? 'status-complete' : 'status-pending';
                    const btnText = p.treatmentStatus === 'Treated' ? 'Mark Ongoing' : 'Mark Treated';
                    const btnColor = p.treatmentStatus === 'Treated' ? 'btn-outline' : 'btn-primary';
                    const btnStyle = p.treatmentStatus === 'Treated' ? 'border-color: #1e3a8a; color: #1e3a8a;' : '';

                    // Your exact custom date format
                    const date = p.createdAt ? p.createdAt.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'N/A';

                    cardContainer.innerHTML += `
                        <div class="treatment-card">
                            <div class="treatment-card-header">
                                <span class="treatment-id">${p.patientId}</span>
                                <span class="treatment-date">${date}</span>
                            </div>
                            <div class="treatment-name">${p.firstName} ${p.lastName}</div>
                            <div class="treatment-details">
                                <span class="status-badge ${badgeClass}">${p.treatmentStatus}</span>
                                <button class="btn ${btnColor}" style="padding: 6px 12px; font-size: 12px; ${btnStyle}" onclick="toggleStatus('${p.id}', '${p.treatmentStatus}')">${btnText}</button>
                            </div>
                        </div>
                    `;
                });
            }
            // --- END OF APPLY FILTER & RENDER CARDS ---

            // --- START OF TOGGLE STATUS ---
            window.toggleStatus = function(docId, currentStatus) {
                const newStatus = currentStatus === 'Treated' ? 'Ongoing' : 'Treated';
                
                showConfirm("Update Status", `Are you sure you want to change this patient's status to <strong>${newStatus}</strong>?`, () => {
                    db.collection('patients').doc(docId).update({ treatmentStatus: newStatus })
                    .then(() => {
                        logActivity(auth.currentUser, "Updated Treatment Status", `Patient set to ${newStatus}`);
                        showAlert("Success", `Patient marked as ${newStatus}`, "✔️");
                    }).catch(err => showAlert("Error", err.message, "❌"));
                });
            };
            // --- END OF TOGGLE STATUS ---
        });
        // --- END OF TREATMENT LIST INITIALIZATION ---
    </script>
</body>
</html>
