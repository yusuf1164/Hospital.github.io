<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Credentials - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; font-size: 16px; font-weight: bold; color: #6b7280; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; }
        .tab-btn:hover { color: #1e3a8a; background: #f9fafb; }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container" style="max-width: 800px;">
            <div class="page-header">
                <h1>✏️ Edit Credentials</h1>
                <p>Update patient or staff information.</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('patient')" id="tabPatient">Patient Info</button>
                <button class="tab-btn" onclick="switchTab('staff')" id="tabStaff">Staff Info</button>
            </div>

            <div class="form-card" style="margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label id="searchLabel">Search Patient by Name or ID</label>
                    <div class="autocomplete-container">
                        <input type="text" id="searchInput" placeholder="Type to search..." autocomplete="off">
                        <div id="autocompleteList" class="autocomplete-list"></div>
                        <input type="hidden" id="selectedDocId">
                    </div>
                </div>
            </div>

            <div class="form-card" id="editFormContainer" style="display: none; border-left: 4px solid #2563eb;">
                <h3 id="editFormTitle">Editing...</h3>
                <form id="editForm">
                    
                    <!-- PATIENT FIELDS -->
                    <div id="patientFields" style="display: none;">
                        <div class="form-grid">
                            <div class="form-group"><label>First Name</label><input type="text" id="pFirstName"></div>
                            <div class="form-group"><label>Last Name</label><input type="text" id="pLastName"></div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" id="pDob">
                                <div id="ageDisplay_patient" style="font-size: 14px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div>
                            </div>
                            <div class="form-group">
                                <label>Gender</label>
                                <select id="pGender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
                            </div>
                            <!-- PATIENT RELIGION -->
                            <div class="form-group">
                                <label>Religion</label>
                                <select id="pReligion">
                                    <option value="Christianity">Christianity</option>
                                    <option value="Islam">Islam</option>
                                    <option value="Traditional">Traditional</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Phone Number</label><input type="text" id="pPhone"></div>
                            <div class="form-group" style="grid-column: 1 / -1;"><label>Address</label><input type="text" id="pAddress"></div>
                        </div>
                    </div>

                    <!-- STAFF FIELDS -->
                    <div id="staffFields" style="display: none;">
                        <div class="form-grid">
                            <div class="form-group"><label>First Name</label><input type="text" id="sFirstName"></div>
                            <div class="form-group"><label>Last Name</label><input type="text" id="sLastName"></div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" id="sDob">
                                <div id="ageDisplay_staff" style="font-size: 14px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div>
                            </div>
                            <div class="form-group">
                                <label>Gender</label>
                                <select id="sGender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
                            </div>
                            <!-- STAFF RELIGION -->
                            <div class="form-group">
                                <label>Religion</label>
                                <select id="sReligion">
                                    <option value="Christianity">Christianity</option>
                                    <option value="Islam">Islam</option>
                                    <option value="Traditional">Traditional</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Phone Number</label><input type="text" id="sPhone"></div>
                            <div class="form-group"><label>Email Address</label><input type="email" id="sEmail"></div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="cancelEdit()">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="flex:1;" id="saveBtn">Save Changes</button>
                    </div>
                    <div id="msgBox" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
                </form>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['admin', 'hr']);
        
        let currentTab = 'patient';
        let currentDataList = [];

        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocompleteList');
        const selectedDocId = document.getElementById('selectedDocId');
        const editFormContainer = document.getElementById('editFormContainer');

        // Live Age Calculation
        document.getElementById('pDob').addEventListener('change', function() {
            const age = calculateAge(this.value);
            document.getElementById('ageDisplay_patient').textContent = age !== "" ? `Calculated Age: ${age} years old` : "";
        });
        document.getElementById('sDob').addEventListener('change', function() {
            const age = calculateAge(this.value);
            document.getElementById('ageDisplay_staff').textContent = age !== "" ? `Calculated Age: ${age} years old` : "";
        });

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabPatient').classList.toggle('active', tab === 'patient');
            document.getElementById('tabStaff').classList.toggle('active', tab === 'staff');
            
            searchInput.value = '';
            selectedDocId.value = '';
            editFormContainer.style.display = 'none';
            autocompleteList.style.display = 'none';
            
            if (tab === 'patient') {
                document.getElementById('searchLabel').textContent = 'Search Patient by Name or P ID';
                document.getElementById('patientFields').style.display = 'block';
                document.getElementById('staffFields').style.display = 'none';
                loadData('patients');
            } else {
                document.getElementById('searchLabel').textContent = 'Search Staff by Name or Staff ID';
                document.getElementById('patientFields').style.display = 'none';
                document.getElementById('staffFields').style.display = 'block';
                loadData('users');
            }
        };

        function loadData(collectionName) {
            currentDataList = [];
            db.collection(collectionName).get().then(snap => {
                snap.forEach(doc => {
                    const d = doc.data();
                    if (collectionName === 'users' && !d.staffId) return;
                    currentDataList.push({ id: doc.id, ...d });
                });
            });
        }

        searchInput.addEventListener('focus', () => renderDropdown(currentDataList));
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            selectedDocId.value = "";
            editFormContainer.style.display = 'none';

            const filtered = currentDataList.filter(item => {
                const name = `${item.firstName || ''} ${item.lastName || ''}`.toLowerCase();
                const id = String(item.patientId || item.staffId || '').toLowerCase();
                return name.includes(term) || id.includes(term);
            });
            renderDropdown(filtered);
        });

        function renderDropdown(items) {
            autocompleteList.innerHTML = '';
            if (items.length === 0) { autocompleteList.style.display = 'none'; return; }
            
            items.forEach(item => {
                const displayId = item.patientId || item.staffId;
                const div = document.createElement('div');
                div.innerHTML = `<strong>${item.firstName} ${item.lastName}</strong> (ID: ${displayId})`;
                div.addEventListener('click', () => {
                    searchInput.value = `${item.firstName} ${item.lastName} (${displayId})`;
                    selectedDocId.value = item.id; 
                    autocompleteList.style.display = 'none';
                    populateForm(item);
                });
                autocompleteList.appendChild(div);
            });
            autocompleteList.style.display = 'block';
        }

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none';
        });

        function populateForm(data) {
            editFormContainer.style.display = 'block';
            document.getElementById('msgBox').textContent = '';
            
            if (currentTab === 'patient') {
                document.getElementById('editFormTitle').textContent = `Editing Patient: ${data.patientId}`;
                document.getElementById('pFirstName').value = data.firstName || '';
                document.getElementById('pLastName').value = data.lastName || '';
                document.getElementById('pDob').value = data.dob || '';
                
                if(data.dob) {
                    document.getElementById('ageDisplay_patient').textContent = `Calculated Age: ${calculateAge(data.dob)} years old`;
                } else {
                    document.getElementById('ageDisplay_patient').textContent = '';
                }

                document.getElementById('pGender').value = data.gender || 'Male';
                document.getElementById('pReligion').value = data.religion || 'Christianity'; // Load Religion
                document.getElementById('pPhone').value = data.phone || '';
                document.getElementById('pAddress').value = data.address || '';
            } else {
                document.getElementById('editFormTitle').textContent = `Editing Staff: ${data.staffId}`;
                document.getElementById('sFirstName').value = data.firstName || '';
                document.getElementById('sLastName').value = data.lastName || '';
                document.getElementById('sDob').value = data.dob || '';
                
                if(data.dob) {
                    document.getElementById('ageDisplay_staff').textContent = `Calculated Age: ${calculateAge(data.dob)} years old`;
                } else {
                    document.getElementById('ageDisplay_staff').textContent = '';
                }

                document.getElementById('sGender').value = data.gender || 'Male';
                document.getElementById('sReligion').value = data.religion || 'Christianity'; // Load Religion
                document.getElementById('sPhone').value = data.phone || '';
                document.getElementById('sEmail').value = data.email || '';
            }
        }

        window.cancelEdit = function() {
            searchInput.value = '';
            selectedDocId.value = '';
            editFormContainer.style.display = 'none';
        };

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const docId = selectedDocId.value;
            if (!docId) return;

            const msgBox = document.getElementById('msgBox');
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.textContent = 'Saving...'; saveBtn.disabled = true;

            let updateData = {};

            if (currentTab === 'patient') {
                const dob = document.getElementById('pDob').value;
                const calculatedAge = calculateAge(dob);

                updateData = {
                    firstName: document.getElementById('pFirstName').value,
                    lastName: document.getElementById('pLastName').value,
                    dob: dob,
                    age: calculatedAge,
                    gender: document.getElementById('pGender').value,
                    religion: document.getElementById('pReligion').value, // Save Religion
                    phone: document.getElementById('pPhone').value,
                    address: document.getElementById('pAddress').value
                };
            } else {
                const dob = document.getElementById('sDob').value;
                const calculatedAge = calculateAge(dob);

                updateData = {
                    firstName: document.getElementById('sFirstName').value,
                    lastName: document.getElementById('sLastName').value,
                    dob: dob,
                    age: calculatedAge,
                    gender: document.getElementById('sGender').value,
                    religion: document.getElementById('sReligion').value, // Save Religion
                    phone: document.getElementById('sPhone').value,
                    email: document.getElementById('sEmail').value
                };
            }

            const collectionName = currentTab === 'patient' ? 'patients' : 'users';

            db.collection(collectionName).doc(docId).update(updateData).then(() => {
                msgBox.style.color = 'green';
                msgBox.textContent = 'Credentials updated successfully!';
                saveBtn.textContent = 'Save Changes'; saveBtn.disabled = false;
                logActivity(auth.currentUser, "Updated Credentials", `Updated ${currentTab} ID: ${docId}`);
                loadData(collectionName);
            }).catch(err => {
                msgBox.style.color = 'red';
                msgBox.textContent = 'Error: ' + err.message;
                saveBtn.textContent = 'Save Changes'; saveBtn.disabled = false;
            });
        });

        switchTab('patient');
    </script>
</body>
</html>
