<!DOCTYPE html> <!-- Declares HTML5 -->
<html lang="en"> <!-- Sets language -->
<head> <!-- Opens head -->
    <meta charset="UTF-8"> <!-- Encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile -->
    <title>Edit Credentials - DEEN Hospital</title> <!-- Title -->
    <link rel="stylesheet" href="../style.css"> <!-- CSS -->
    <style> /* Internal styles for tabs */
        .tabs { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 20px; } /* Tab container */
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; font-size: 16px; font-weight: bold; color: #6b7280; cursor: pointer; transition: 0.3s; } /* Tab buttons */
        .tab-btn.active { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; } /* Active tab */
        .tab-btn:hover { color: #1e3a8a; background: #f9fafb; } /* Hover effect */
    </style> <!-- Closes styles -->
</head> <!-- Closes head -->
<body> <!-- Opens body -->
    <header id="header-placeholder"></header> <!-- Header placeholder -->
    <main> <!-- Opens main -->
        <div class="table-container" style="max-width: 800px;"> <!-- Container -->
            <div class="page-header"> <!-- Header -->
                <h1>✏️ Edit Credentials</h1> <!-- Title -->
                <p>Update patient or staff information.</p> <!-- Subtitle -->
            </div> <!-- Closes header -->

            <div class="tabs"> <!-- Tabs -->
                <button class="tab-btn active" onclick="switchTab('patient')" id="tabPatient">Patient Info</button> <!-- Patient tab -->
                <button class="tab-btn" onclick="switchTab('staff')" id="tabStaff">Staff Info</button> <!-- Staff tab -->
            </div> <!-- Closes tabs -->

            <div class="form-card" style="margin-bottom: 20px;"> <!-- Search card -->
                <div class="form-group" style="margin-bottom: 0;"> <!-- Group -->
                    <label id="searchLabel">Search Patient by Name or ID</label> <!-- Label -->
                    <div class="autocomplete-container"> <!-- Autocomplete wrapper -->
                        <input type="text" id="searchInput" placeholder="Type to search..." autocomplete="off"> <!-- Search input -->
                        <div id="autocompleteList" class="autocomplete-list"></div> <!-- Dropdown list -->
                        <input type="hidden" id="selectedDocId"> <!-- Hidden ID -->
                    </div> <!-- Closes wrapper -->
                </div> <!-- Closes group -->
            </div> <!-- Closes card -->

            <div class="form-card" id="editFormContainer" style="display: none; border-left: 4px solid #2563eb;"> <!-- Edit form card -->
                <h3 id="editFormTitle">Editing...</h3> <!-- Form title -->
                <form id="editForm"> <!-- Opens form -->
                    
                    <!-- PATIENT FIELDS -->
                    <div id="patientFields" style="display: none;"> <!-- Patient section -->
                        <div class="form-grid"> <!-- Grid -->
                            <div class="form-group"><label>First Name</label><input type="text" id="pFirstName"></div> <!-- First name -->
                            <div class="form-group"><label>Last Name</label><input type="text" id="pLastName"></div> <!-- Last name -->
                            
                            <!-- Patient DOB -->
                            <div class="form-group"> <!-- Group -->
                                <label>Date of Birth</label> <!-- Label -->
                                <input type="date" id="pDob"> <!-- Date input -->
                                <div id="ageDisplay_patient" style="font-size: 14px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div> <!-- Age display -->
                            </div> <!-- Closes group -->
                            
                            <div class="form-group"> <!-- Group -->
                                <label>Gender</label> <!-- Label -->
                                <select id="pGender"> <!-- Dropdown -->
                                    <option value="Male">Male</option> <!-- Male -->
                                    <option value="Female">Female</option> <!-- Female -->
                                    <option value="Other">Other</option> <!-- Other -->
                                </select> <!-- Closes dropdown -->
                            </div> <!-- Closes group -->
                            <div class="form-group"><label>Phone Number</label><input type="text" id="pPhone"></div> <!-- Phone -->
                            <div class="form-group" style="grid-column: 1 / -1;"><label>Address</label><input type="text" id="pAddress"></div> <!-- Address -->
                        </div> <!-- Closes grid -->
                    </div> <!-- Closes patient section -->

                    <!-- STAFF FIELDS -->
                    <div id="staffFields" style="display: none;"> <!-- Staff section -->
                        <div class="form-grid"> <!-- Grid -->
                            <div class="form-group"><label>First Name</label><input type="text" id="sFirstName"></div> <!-- First name -->
                            <div class="form-group"><label>Last Name</label><input type="text" id="sLastName"></div> <!-- Last name -->
                            
                            <!-- Staff DOB -->
                            <div class="form-group"> <!-- Group -->
                                <label>Date of Birth</label> <!-- Label -->
                                <input type="date" id="sDob"> <!-- Date input -->
                                <div id="ageDisplay_staff" style="font-size: 14px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div> <!-- Age display -->
                            </div> <!-- Closes group -->
                            
                            <div class="form-group"> <!-- Group -->
                                <label>Gender</label> <!-- Label -->
                                <select id="sGender"> <!-- Dropdown -->
                                    <option value="Male">Male</option> <!-- Male -->
                                    <option value="Female">Female</option> <!-- Female -->
                                    <option value="Other">Other</option> <!-- Other -->
                                </select> <!-- Closes dropdown -->
                            </div> <!-- Closes group -->
                            <div class="form-group"><label>Phone Number</label><input type="text" id="sPhone"></div> <!-- Phone -->
                            <div class="form-group"><label>Email Address</label><input type="email" id="sEmail"></div> <!-- Email -->
                        </div> <!-- Closes grid -->
                        <p style="font-size: 12px; color: #dc2626; margin-top: 10px;">* Note: Changing the email here updates the hospital record, but not the actual login email.</p> <!-- Warning -->
                    </div> <!-- Closes staff section -->

                    <div style="display: flex; gap: 10px; margin-top: 20px;"> <!-- Buttons -->
                        <button type="button" class="btn btn-outline" style="flex:1; border-color: #ccc; color: #333;" onclick="cancelEdit()">Cancel</button> <!-- Cancel -->
                        <button type="submit" class="btn btn-primary" style="flex:1;" id="saveBtn">Save Changes</button> <!-- Save -->
                    </div> <!-- Closes buttons -->
                    <div id="msgBox" style="text-align: center; margin-top: 15px; font-weight: bold;"></div> <!-- Message -->
                </form> <!-- Closes form -->
            </div> <!-- Closes card -->

        </div> <!-- Closes container -->
    </main> <!-- Closes main -->
    <footer id="footer-placeholder"></footer> <!-- Footer placeholder -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> <!-- Firebase App -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script> <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script> <!-- Firebase Firestore -->
    <script src="../script.js"></script> <!-- Main Script -->

    <script>
        enforceAuth(['admin', 'hr']); // Security check
        
        let currentTab = 'patient'; // Default tab
        let currentDataList = []; // Data memory

        const searchInput = document.getElementById('searchInput'); // Search input ref
        const autocompleteList = document.getElementById('autocompleteList'); // Dropdown ref
        const selectedDocId = document.getElementById('selectedDocId'); // Hidden ID ref
        const editFormContainer = document.getElementById('editFormContainer'); // Form container ref

        // Event listeners for real-time age calculation
        document.getElementById('pDob').addEventListener('change', function() { // Patient DOB listener
            const age = calculateAge(this.value); // Calculate age
            document.getElementById('ageDisplay_patient').textContent = age !== "" ? `Age: ${age} years old` : ""; // Display
        });
        document.getElementById('sDob').addEventListener('change', function() { // Staff DOB listener
            const age = calculateAge(this.value); // Calculate age
            document.getElementById('ageDisplay_staff').textContent = age !== "" ? `Age: ${age} years old` : ""; // Display
        });

        window.switchTab = function(tab) { // Tab switch function
            currentTab = tab; // Set current
            document.getElementById('tabPatient').classList.toggle('active', tab === 'patient'); // Toggle classes
            document.getElementById('tabStaff').classList.toggle('active', tab === 'staff'); // Toggle classes
            
            searchInput.value = ''; // Clear search
            selectedDocId.value = ''; // Clear ID
            editFormContainer.style.display = 'none'; // Hide form
            autocompleteList.style.display = 'none'; // Hide dropdown
            
            if (tab === 'patient') { // If patient tab
                document.getElementById('searchLabel').textContent = 'Search Patient by Name or P ID'; // Update label
                document.getElementById('patientFields').style.display = 'block'; // Show patient fields
                document.getElementById('staffFields').style.display = 'none'; // Hide staff fields
                loadData('patients'); // Load data
            } else { // If staff tab
                document.getElementById('searchLabel').textContent = 'Search Staff by Name or Staff ID'; // Update label
                document.getElementById('patientFields').style.display = 'none'; // Hide patient fields
                document.getElementById('staffFields').style.display = 'block'; // Show staff fields
                loadData('users'); // Load data
            }
        };

        function loadData(collectionName) { // Function to load data
            currentDataList = []; // Clear memory
            db.collection(collectionName).get().then(snap => { // Get collection
                snap.forEach(doc => { // Loop docs
                    const d = doc.data(); // Get data
                    if (collectionName === 'users' && !d.staffId) return; // Skip non-staff
                    currentDataList.push({ id: doc.id, ...d }); // Add to memory
                });
            });
        }

        searchInput.addEventListener('focus', () => renderDropdown(currentDataList)); // Show list on focus
        searchInput.addEventListener('input', (e) => { // On typing
            const term = e.target.value.toLowerCase(); // Get term
            selectedDocId.value = ""; // Reset ID
            editFormContainer.style.display = 'none'; // Hide form

            const filtered = currentDataList.filter(item => { // Filter list
                const name = `${item.firstName || ''} ${item.lastName || ''}`.toLowerCase(); // Get name
                const id = String(item.patientId || item.staffId || '').toLowerCase(); // Get ID
                return name.includes(term) || id.includes(term); // Check match
            });
            renderDropdown(filtered); // Render
        });

        function renderDropdown(items) { // Function to render dropdown
            autocompleteList.innerHTML = ''; // Clear list
            if (items.length === 0) { autocompleteList.style.display = 'none'; return; } // Hide if empty
            
            items.forEach(item => { // Loop items
                const displayId = item.patientId || item.staffId; // Get display ID
                const div = document.createElement('div'); // Create div
                div.innerHTML = `<strong>${item.firstName} ${item.lastName}</strong> (ID: ${displayId})`; // Set HTML
                div.addEventListener('click', () => { // On click
                    searchInput.value = `${item.firstName} ${item.lastName} (${displayId})`; // Set input
                    selectedDocId.value = item.id; // Set hidden ID
                    autocompleteList.style.display = 'none'; // Hide list
                    populateForm(item); // Fill form
                });
                autocompleteList.appendChild(div); // Add to list
            });
            autocompleteList.style.display = 'block'; // Show list
        }

        document.addEventListener('click', (e) => { // Close dropdown when clicking outside
            if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none';
        });

        function populateForm(data) { // Function to fill form
            editFormContainer.style.display = 'block'; // Show form
            document.getElementById('msgBox').textContent = ''; // Clear message
            
            if (currentTab === 'patient') { // If patient
                document.getElementById('editFormTitle').textContent = `Editing Patient: ${data.patientId}`; // Set title
                document.getElementById('pFirstName').value = data.firstName || ''; // Fill first name
                document.getElementById('pLastName').value = data.lastName || ''; // Fill last name
                document.getElementById('pDob').value = data.dob || ''; // Fill DOB
                
                // Update age display immediately
                if(data.dob) { // If DOB exists
                    document.getElementById('ageDisplay_patient').textContent = `Age: ${calculateAge(data.dob)} years old`; // Show age
                } else { // If no DOB
                    document.getElementById('ageDisplay_patient').textContent = ''; // Clear age
                }

                document.getElementById('pGender').value = data.gender || 'Male'; // Fill gender
                document.getElementById('pPhone').value = data.phone || ''; // Fill phone
                document.getElementById('pAddress').value = data.address || ''; // Fill address
            } else { // If staff
                document.getElementById('editFormTitle').textContent = `Editing Staff: ${data.staffId}`; // Set title
                document.getElementById('sFirstName').value = data.firstName || ''; // Fill first name
                document.getElementById('sLastName').value = data.lastName || ''; // Fill last name
                document.getElementById('sDob').value = data.dob || ''; // Fill DOB
                
                // Update age display immediately
                if(data.dob) { // If DOB exists
                    document.getElementById('ageDisplay_staff').textContent = `Age: ${calculateAge(data.dob)} years old`; // Show age
                } else { // If no DOB
                    document.getElementById('ageDisplay_staff').textContent = ''; // Clear age
                }

                document.getElementById('sGender').value = data.gender || 'Male'; // Fill gender
                document.getElementById('sPhone').value = data.phone || ''; // Fill phone
                document.getElementById('sEmail').value = data.email || ''; // Fill email
            }
        }

        window.cancelEdit = function() { // Function to cancel editing
            searchInput.value = ''; // Clear search
            selectedDocId.value = ''; // Clear ID
            editFormContainer.style.display = 'none'; // Hide form
        };

        document.getElementById('editForm').addEventListener('submit', (e) => { // On submit
            e.preventDefault(); // Prevent reload
            const docId = selectedDocId.value; // Get ID
            if (!docId) return; // If no ID, stop

            const msgBox = document.getElementById('msgBox'); // Get message box
            const saveBtn = document.getElementById('saveBtn'); // Get button
            saveBtn.textContent = 'Saving...'; saveBtn.disabled = true; // Disable button

            let updateData = {}; // Object to store updates

            if (currentTab === 'patient') { // If patient
                const dob = document.getElementById('pDob').value; // Get DOB
                const calculatedAge = calculateAge(dob); // Calculate age

                updateData = { // Build object
                    firstName: document.getElementById('pFirstName').value, // First name
                    lastName: document.getElementById('pLastName').value, // Last name
                    dob: dob, // DOB
                    age: calculatedAge, // Age
                    gender: document.getElementById('pGender').value, // Gender
                    phone: document.getElementById('pPhone').value, // Phone
                    address: document.getElementById('pAddress').value // Address
                };
            } else { // If staff
                const dob = document.getElementById('sDob').value; // Get DOB
                const calculatedAge = calculateAge(dob); // Calculate age

                updateData = { // Build object
                    firstName: document.getElementById('sFirstName').value, // First name
                    lastName: document.getElementById('sLastName').value, // Last name
                    dob: dob, // DOB
                    age: calculatedAge, // Age
                    gender: document.getElementById('sGender').value, // Gender
                    phone: document.getElementById('sPhone').value, // Phone
                    email: document.getElementById('sEmail').value // Email
                };
            }

            const collectionName = currentTab === 'patient' ? 'patients' : 'users'; // Get collection name

            db.collection(collectionName).doc(docId).update(updateData).then(() => { // Update DB
                msgBox.style.color = 'green'; // Green text
                msgBox.textContent = 'Credentials updated successfully!'; // Success message
                saveBtn.textContent = 'Save Changes'; saveBtn.disabled = false; // Reset button
                logActivity(auth.currentUser, "Updated Credentials", `Updated ${currentTab} ID: ${docId}`); // Log action
                loadData(collectionName); // Reload data
            }).catch(err => { // On error
                msgBox.style.color = 'red'; // Red text
                msgBox.textContent = 'Error: ' + err.message; // Error message
                saveBtn.textContent = 'Save Changes'; saveBtn.disabled = false; // Reset button
            });
        });

        switchTab('patient'); // Start with patient tab
    </script>
</body> <!-- Closes body -->
</html> <!-- Closes html -->
