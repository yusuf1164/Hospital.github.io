<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing / Vitals - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🌡️ Nursing Department</h1>
                <p>Record patient vitals.</p>
            </div>

            <div class="form-card">
                <h3>Record Vitals</h3>
                <form id="nursingForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <input type="text" id="searchNursePatient" placeholder="Type Name, P ID, or Phone..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px;">
                            <select id="nursePatientSelect" required style="display: none; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></select>
                        </div>
                        <div class="form-group"><label>BP (mmHg)</label><input type="text" id="bp" required placeholder="120/80"></div>
                        <div class="form-group"><label>Temp (°C)</label><input type="number" step="0.1" id="temp" required placeholder="37.2"></div>
                        <div class="form-group"><label>Weight (kg)</label><input type="number" step="0.1" id="weight" required placeholder="70.5"></div>
                        <div class="form-group"><label>Pulse (bpm)</label><input type="number" id="pulse" required placeholder="72"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Save Vitals</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Vitals</h3>
            <table>
                <thead>
                    <tr><th>Patient ID</th><th>Patient Name</th><th>BP</th><th>Temp</th><th>Weight</th><th>Pulse</th><th>Date</th></tr>
                </thead>
                <tbody id="vitalsTableBody">
                    <tr><td colspan="7" style="text-align:center; color:#888;">Loading vitals...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['nurse']);

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const searchNursePatient = document.getElementById('searchNursePatient');
            const nursePatientSelect = document.getElementById('nursePatientSelect');
            const tbody = document.getElementById('vitalsTableBody');
            let allPatients = [];

            db.collection('patients').get().then(snap => {
                snap.forEach(doc => allPatients.push(doc.data()));
            }).catch(err => console.error(err));

            searchNursePatient.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                if (term.length < 2) { nursePatientSelect.style.display = 'none'; return; }
                const filtered = allPatients.filter(p => {
                    const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    const phone = String(p.phone).toLowerCase();
                    return name.includes(term) || pid.includes(term) || phone.includes(term);
                });
                nursePatientSelect.innerHTML = '<option value="">Select patient...</option>';
                filtered.forEach(p => nursePatientSelect.innerHTML += `<option value="${p.patientId}" data-name="${p.firstName} ${p.lastName}">${p.patientId} - ${p.firstName} ${p.lastName}</option>`);
                nursePatientSelect.style.display = filtered.length > 0 ? 'block' : 'none';
            });

            db.collection('vitals').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No vitals recorded yet.</td></tr>`;
                    return;
                }
                let vitals = [];
                snapshot.forEach(doc => vitals.push(doc.data()));
                vitals.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                tbody.innerHTML = '';
                vitals.slice(0, 20).forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.patientName}</strong></td>
                            <td>${d.bp}</td><td>${d.temp}°C</td><td>${d.weight}kg</td><td>${d.pulse}</td><td>${date}</td>
                        </tr>
                    `;
                });
            }, error => {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
            });

            document.getElementById('nursingForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!nursePatientSelect.value) { alert("Please select a patient."); return; }
                const patientId = nursePatientSelect.value;
                const patientName = nursePatientSelect.options[nursePatientSelect.selectedIndex].getAttribute('data-name');

                db.collection('vitals').add({
                    patientId: patientId, patientName: patientName,
                    bp: document.getElementById('bp').value, temp: document.getElementById('temp').value,
                    weight: document.getElementById('weight').value, pulse: document.getElementById('pulse').value,
                    recordedBy: user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert('Vitals Saved!');
                    document.getElementById('nursingForm').reset();
                    nursePatientSelect.style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
