<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing / Vitals - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🌡️ Nursing Department</h1>
                <p>Record patient vitals.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <div class="form-card">
                <h3>Record Vitals</h3>
                <form id="nursingForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <div class="autocomplete-container">
                                <input type="text" id="patientSearchInput" placeholder="Type Name, P ID..." autocomplete="off">
                                <div id="autocompleteList" class="autocomplete-list"></div>
                                <input type="hidden" id="selectedPatientId">
                            </div>
                        </div>
                        <div class="form-group"><label>BP (mmHg)</label><input type="text" id="bp" required placeholder="120/80"></div>
                        <div class="form-group"><label>Temp (°C)</label><input type="number" step="0.1" id="temp" required placeholder="37.2"></div>
                        <div class="form-group"><label>Weight (kg)</label><input type="number" step="0.1" id="weight" required placeholder="70.5"></div>
                        <div class="form-group"><label>Pulse (bpm)</label><input type="number" id="pulse" required placeholder="72"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Save Vitals</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Vitals</h3>
            <div id="vitalsCardContainer" class="card-grid-layout">
                <p style="text-align:center; width:100%; color:#888;">Loading vitals...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['nurse']);
        auth.onAuthStateChanged((user) => {
            if (!user) return;
            const searchInput = document.getElementById('patientSearchInput');
            const autocompleteList = document.getElementById('autocompleteList');
            const hiddenPatientId = document.getElementById('selectedPatientId');
            const cardContainer = document.getElementById('vitalsCardContainer');
            let debounceTimer;

            // Search Logic
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                clearTimeout(debounceTimer);
                hiddenPatientId.value = ""; searchInput.dataset.name = "";
                autocompleteList.style.display = 'none';
                if (term.length < 2) return; 

                debounceTimer = setTimeout(async () => {
                    autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">Searching...</div>';
                    autocompleteList.style.display = 'block';
                    let results = []; let seenIds = new Set();

                    try {
                        const idSnap = await db.collection('patients').where('patientId', '==', term.toUpperCase()).get();
                        idSnap.forEach(doc => { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); });
                    } catch (e) {}
                    try {
                        const st = term.charAt(0).toUpperCase() + term.slice(1);
                        const nameSnap = await db.collection('patients').orderBy('firstName').startAt(st).endAt(st + '\uf8ff').limit(10).get();
                        nameSnap.forEach(doc => { if (!seenIds.has(doc.id)) { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); } });
                    } catch (e) {}

                    autocompleteList.innerHTML = results.length === 0 ? '<div style="padding: 10px; color: #888;">No matches.</div>' : '';
                    results.forEach(p => {
                        const div = document.createElement('div');
                        div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                        div.onclick = () => {
                            searchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                            hiddenPatientId.value = p.patientId; searchInput.dataset.name = `${p.firstName} ${p.lastName}`;
                            autocompleteList.style.display = 'none';
                        };
                        autocompleteList.appendChild(div);
                    });
                }, 300);
            });
            document.addEventListener('click', (e) => { if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none'; });

            // Load Vitals Queue
            db.collection('vitals').orderBy('createdAt', 'desc').limit(50).onSnapshot(snapshot => {
                if (snapshot.empty) { cardContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No vitals recorded.</p>`; return; }
                let results = []; snapshot.forEach(doc => results.push({ id: doc.id, ...doc.data() }));
                
                cardContainer.innerHTML = '';
                results.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    cardContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header">
                                <span class="data-id">${d.patientId}</span>
                                <span class="data-date">${date}</span>
                            </div>
                            <div class="data-name">${d.patientName}</div>
                            <div class="data-info" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                                <div><strong>BP:</strong> ${d.bp}</div>
                                <div><strong>Temp:</strong> ${d.temp}°C</div>
                                <div><strong>Weight:</strong> ${d.weight}kg</div>
                                <div><strong>Pulse:</strong> ${d.pulse}</div>
                            </div>
                        </div>
                    `;
                });
            });

            // Submit Vitals
            document.getElementById('nursingForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!hiddenPatientId.value) { showAlert("Error", "Please select a patient.", "❌"); return; }
                db.collection('vitals').add({
                    patientId: hiddenPatientId.value, patientName: searchInput.dataset.name,
                    bp: document.getElementById('bp').value, temp: document.getElementById('temp').value,
                    weight: document.getElementById('weight').value, pulse: document.getElementById('pulse').value,
                    recordedBy: user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showAlert("Success", "Vitals Saved!", "✔️");
                    document.getElementById('nursingForm').reset(); searchInput.value = ''; hiddenPatientId.value = '';
                }).catch(err => showAlert("Error", err.message, "❌"));
            });
        });
    </script>
</body>
</html>
