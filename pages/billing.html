<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💳 Billing / Accounts</h1>
                <p>Generate invoices and process payments.</p>
            </div>

            <div class="form-card">
                <h3>Create New Invoice</h3>
                <form id="billingForm">
                    <div class="form-grid">
                        <!-- AUTOCOMPLETE SEARCH -->
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <div class="autocomplete-container">
                                <input type="text" id="patientSearchInput" placeholder="Type Name, P ID, or Phone..." autocomplete="off">
                                <div id="autocompleteList" class="autocomplete-list"></div>
                                <input type="hidden" id="selectedPatientId">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Service Rendered</label>
                            <input type="text" id="service" required placeholder="e.g. Consultation, Lab Test">
                        </div>
                        <div class="form-group">
                            <label>Amount (₦)</label>
                            <input type="number" id="amount" required placeholder="5000">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Generate Bill</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Invoices</h3>
            <table>
                <thead><tr><th>Date</th><th>Patient ID</th><th>Patient Name</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="billingTableBody">
                    <tr><td colspan="7" style="text-align:center; color:#888;">Loading invoices...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['billing', 'reception']);

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const searchInput = document.getElementById('patientSearchInput');
            const autocompleteList = document.getElementById('autocompleteList');
            const hiddenPatientId = document.getElementById('selectedPatientId');
            const tbody = document.getElementById('billingTableBody');
            let allPatients = [];

            // Load Patients for Autocomplete
            db.collection('patients').get().then(snap => { snap.forEach(doc => allPatients.push(doc.data())); });

            // Autocomplete Logic
            searchInput.addEventListener('focus', () => { renderDropdown(allPatients); });
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                hiddenPatientId.value = "";
                const filtered = allPatients.filter(p => {
                    const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    const phone = String(p.phone).toLowerCase();
                    return name.includes(term) || pid.includes(term) || phone.includes(term);
                });
                renderDropdown(filtered);
            });

            function renderDropdown(patients) {
                autocompleteList.innerHTML = '';
                if (patients.length === 0) { autocompleteList.style.display = 'none'; return; }
                patients.forEach(p => {
                    const div = document.createElement('div');
                    div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                    div.addEventListener('click', () => {
                        searchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                        hiddenPatientId.value = p.patientId;
                        autocompleteList.style.display = 'none';
                    });
                    autocompleteList.appendChild(div);
                });
                autocompleteList.style.display = 'block';
            }
            document.addEventListener('click', (e) => {
                if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none';
            });

            // Load Bills Queue
            db.collection('bills').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No invoices generated yet.</td></tr>`;
                    return;
                }
                let bills = [];
                snapshot.forEach(doc => bills.push({ id: doc.id, ...doc.data() }));
                bills.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                tbody.innerHTML = '';
                bills.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { 
                     year: 'numeric', 
                     month: 'short', 
                     day: 'numeric', 
                     hour: '2-digit',
                     minute: '2-digit',
                     second: '2-digit',
                     hour12: true 
                     }) : 'Just now';
                    
                    const badgeClass = d.status === 'Paid' ? 'status-complete' : 'status-pending';
                    const actionHtml = d.status === 'Paid' ? `<span style="color:#065f46; font-weight:bold;">Completed</span>` : `<button class="btn btn-primary" onclick="payBill('${d.id}', '${d.patientName}', '${d.amount}')">Mark as Paid</button>`;
                    tbody.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.patientName}</strong></td>
                            <td>${d.service}</td>
                            <td>₦${Number(d.amount).toLocaleString()}</td>
                            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            }, error => {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
            });

            // Submit Invoice
            document.getElementById('billingForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!hiddenPatientId.value) { alert("Please select a patient from the dropdown."); return; }
                
                const patientId = hiddenPatientId.value;
                const patientName = allPatients.find(p => p.patientId === patientId).firstName + " " + allPatients.find(p => p.patientId === patientId).lastName;
                const amount = document.getElementById('amount').value;

                db.collection('bills').add({
                    patientId: patientId, patientName: patientName,
                    service: document.getElementById('service').value, amount: amount, status: 'Pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    logActivity(auth.currentUser, "Generated Invoice", `Patient: ${patientName} (${patientId}), Amount: ₦${amount}`);
                    alert('Invoice generated!'); 
                    document.getElementById('billingForm').reset(); 
                    searchInput.value = ''; hiddenPatientId.value = '';
                });
            });

            window.payBill = function(billId, patientName, amount) {
                if(confirm(`Confirm payment of ₦${amount} from ${patientName}?`)) {
                    db.collection('bills').doc(billId).update({ status: 'Paid' })
                    .then(() => logActivity(auth.currentUser, "Processed Payment", `Patient: ${patientName}, Amount: ₦${amount}`))
                    .catch(err => alert(err.message));
                }
            };
        });
    </script>
</body>
</html>
