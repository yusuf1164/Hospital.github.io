<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>💳 Billing / Accounts</h1>
                <p>Generate invoices and process payments.</p>
            </div>

            <div class="form-card">
                <h3>Create New Invoice</h3>
                <form id="billingForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <input type="text" id="searchBillPatient" placeholder="Type Name, P ID, or Phone..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px;">
                            <select id="billPatientSelect" required style="display: none; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></select>
                        </div>
                        <div class="form-group"><label>Service Rendered</label><input type="text" id="service" required placeholder="e.g. Consultation, Lab Test"></div>
                        <div class="form-group"><label>Amount (₦)</label><input type="number" id="amount" required placeholder="5000"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Generate Bill</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Recent Invoices</h3>
            <table>
                <thead><tr><th>Date</th><th>Patient ID</th><th>Patient Name</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="billingTableBody">
                    <tr><td colspan="7" style="text-align:center; color:#888;">Loading invoices...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['billing', 'reception']);
        auth.onAuthStateChanged((user) => {
            if (!user) return;
            const searchBillPatient = document.getElementById('searchBillPatient');
            const billPatientSelect = document.getElementById('billPatientSelect');
            const tbody = document.getElementById('billingTableBody');
            let allPatients = [];

            db.collection('patients').get().then(snap => { snap.forEach(doc => allPatients.push(doc.data())); }).catch(err => console.error(err));

            searchBillPatient.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                if (term.length < 2) { billPatientSelect.style.display = 'none'; return; }
                const filtered = allPatients.filter(p => {
                    const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    const phone = String(p.phone).toLowerCase();
                    return name.includes(term) || pid.includes(term) || phone.includes(term);
                });
                billPatientSelect.innerHTML = '<option value="">Select patient...</option>';
                filtered.forEach(p => billPatientSelect.innerHTML += `<option value="${p.patientId}" data-name="${p.firstName} ${p.lastName}">${p.patientId} - ${p.firstName} ${p.lastName}</option>`);
                billPatientSelect.style.display = filtered.length > 0 ? 'block' : 'none';
            });

            db.collection('bills').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No invoices generated yet.</td></tr>`;
                    return;
                }
                let bills = [];
                snapshot.forEach(doc => bills.push({ id: doc.id, ...doc.data() }));
                bills.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                tbody.innerHTML = '';
                bills.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString() : 'Just now';
                    const badgeClass = d.status === 'Paid' ? 'status-complete' : 'status-pending';
                    const actionHtml = d.status === 'Paid' ? `<span style="color:#065f46; font-weight:bold;">Completed</span>` : `<button class="btn btn-primary" onclick="payBill('${d.id}', '${d.patientName}', '${d.amount}')">Mark as Paid</button>`;
                    tbody.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.patientName}</strong></td>
                            <td>${d.service}</td>
                            <td>₦${Number(d.amount).toLocaleString()}</td>
                            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            }, error => {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
            });

            document.getElementById('billingForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!billPatientSelect.value) { alert("Please search and select a patient."); return; }
                db.collection('bills').add({
                    patientId: billPatientSelect.value, patientName: billPatientSelect.options[billPatientSelect.selectedIndex].getAttribute('data-name'),
                    service: document.getElementById('service').value, amount: document.getElementById('amount').value, status: 'Pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    logActivity(auth.currentUser, "Generated Invoice", `Patient: ${billPatientSelect.value}, Amount: ₦${document.getElementById('amount').value}`);
                    alert('Invoice generated!'); document.getElementById('billingForm').reset(); billPatientSelect.style.display = 'none';
                });
            });

            window.payBill = function(billId, patientName, amount) {
                if(confirm(`Confirm payment of ₦${amount} from ${patientName}?`)) {
                    db.collection('bills').doc(billId).update({ status: 'Paid' })
                    .then(() => logActivity(auth.currentUser, "Processed Payment", `Patient: ${patientName}, Amount: ₦${amount}`))
                    .catch(err => alert(err.message));
                }
            };
        });
    </script>
</body>
</html>
