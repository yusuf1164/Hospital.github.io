<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header" style="border-bottom: 3px solid #dc2626; padding-bottom: 15px;">
                <h1 style="color: #dc2626;">🚨 Emergency Department</h1>
                <p>Fast-track patient intake and triage management.</p>
            </div>

            <div class="form-card" style="border-left: 4px solid #dc2626;">
                <h3>Fast-Track Registration</h3>
                <form id="emergencyForm">
                    <div class="form-grid">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required placeholder="Doe"></div>
                        <div class="form-group"><label>Age</label><input type="number" id="age" required placeholder="30"></div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required><option value="">Select...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
                        </div>
                        <div class="form-group"><label>Phone Number (Optional)</label><input type="tel" id="phone" placeholder="+1 (555) 000-0000"></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label style="color: #dc2626; font-weight: bold;">Triage Level / Emergency Reason</label><input type="text" id="triage" required placeholder="e.g. Severe bleeding, Heart attack"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 250px; background-color: #dc2626;">🚨 Register Emergency Case</button>
                </form>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-primary filter-btn" data-filter="Active" style="flex: 1; background-color: #dc2626;">Active Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="Treated" style="flex: 1; border-color: #065f46; color: #065f46;">Treated Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="All" style="flex: 1; border-color: #1e3a8a; color: #1e3a8a;">All Cases</button>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Emergency Records</h3>
            <table>
                <thead><tr><th>
