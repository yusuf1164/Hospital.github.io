<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header" style="border-bottom: 3px solid #dc2626; padding-bottom: 15px;">
                <h1 style="color: #dc2626;">🚨 Emergency Department</h1>
                <p>Fast-track patient intake and triage management.</p>
            </div>

            
            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>
            
            <div class="form-card" style="border-left: 4px solid #dc2626;">
                <h3>Fast-Track Registration</h3>
                <form id="emergencyForm">
                    <div class="form-grid">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required placeholder="John"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required placeholder="Doe"></div>
                        <div class="form-group"><label>Age</label><input type="number" id="age" required placeholder="30"></div>
                        
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required>
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- RELIGION DROPDOWN (Islam First) -->
                        <div class="form-group">
                            <label>Religion</label>
                            <select id="religion" required>
                                <option value="">Select...</option>
                                <option value="Islam">Islam</option>
                                <option value="Christianity">Christianity</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group"><label>Phone Number (Optional)</label><input type="tel" id="phone" placeholder="+1 (555) 000-0000"></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label style="color: #dc2626; font-weight: bold;">Triage Level / Emergency Reason</label><input type="text" id="triage" required placeholder="e.g. Severe bleeding, Heart attack"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 250px; background-color: #dc2626;">🚨 Register Emergency Case</button>
                </form>
            </div>

            <!-- Filter Buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-primary filter-btn" data-filter="Active" style="flex: 1; background-color: #dc2626;">Active Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="Treated" style="flex: 1; border-color: #065f46; color: #065f46;">Treated Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="All" style="flex: 1; border-color: #1e3a8a; color: #1e3a8a;">All Cases</button>
            </div>

            <!-- Emergency Cards Container -->
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Emergency Records</h3>
            <div id="emergencyCardContainer" class="emergency-grid">
                <p style="text-align: center; width: 100%; color: #888;">Loading emergency cases...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF EMERGENCY INITIALIZATION ---
        enforceAuth(['admin', 'doctor', 'nurse', 'reception']);
        let allEmergencies = [];
        let currentFilter = 'Active';

        auth.onAuthStateChanged((user) => {
            if (!user) return;
            
            const cardContainer = document.getElementById('emergencyCardContainer');
            const form = document.getElementById('emergencyForm');

            // --- START OF SCALABLE FETCH (LIMIT TO 50) ---
            db.collection('emergencies').orderBy('createdAt', 'desc').limit(50).onSnapshot((snapshot) => {
                allEmergencies = [];
                snapshot.forEach(doc => allEmergencies.push({ id: doc.id, ...doc.data() }));
                applyFilter(currentFilter);
            }, error => {
                cardContainer.innerHTML = `<p style="color:red; text-align:center;">Error: ${error.message}</p>`;
            });
            // --- END OF SCALABLE FETCH ---

            // --- START OF FILTER BUTTON LOGIC ---
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === currentFilter) {
                    btn.className = 'btn btn-primary filter-btn';
                    if (currentFilter === 'Active') btn.style.cssText = 'flex: 1; background-color: #dc2626;';
                }
                
                btn.addEventListener('click', (e) => {
                    currentFilter = e.target.getAttribute('data-filter');
                    
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.className = 'btn btn-outline filter-btn';
                        b.style.cssText = 'flex: 1;';
                        if (b.getAttribute('data-filter') === 'Active') b.style.cssText = 'flex: 1; border-color: #dc2626; color: #dc2626;';
                        if (b.getAttribute('data-filter') === 'Treated') b.style.cssText = 'flex: 1; border-color: #065f46; color: #065f46;';
                        if (b.getAttribute('data-filter') === 'All') b.style.cssText = 'flex: 1; border-color: #1e3a8a; color: #1e3a8a;';
                    });
                    
                    e.target.className = 'btn btn-primary filter-btn';
                    e.target.style.cssText = 'flex: 1;';
                    if (currentFilter === 'Active') e.target.style.backgroundColor = '#dc2626';
                    
                    applyFilter(currentFilter);
                });
            });
            // --- END OF FILTER BUTTON LOGIC ---

            // --- START OF RENDER CARDS ---
            function applyFilter(filter) {
                let filtered = allEmergencies;
                if (filter !== 'All') filtered = allEmergencies.filter(e => e.status === filter);
                
                if (filtered.length === 0) { 
                    cardContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No ${filter} cases found.</p>`; 
                    return; 
                }
                
                cardContainer.innerHTML = '';
                filtered.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'Just now';

                    const badgeClass = d.status === 'Treated' ? 'status-complete' : 'status-pending';
                    const actionHtml = d.status === 'Active' 
                        ? `<button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px; background-color: #dc2626;" onclick="resolveEmergency('${d.id}', '${d.firstName} ${d.lastName}', '${d.patientId}')">Mark Treated</button>` 
                        : `<span style="color:#065f46; font-weight:bold;">Completed</span>`;

                    cardContainer.innerHTML += `
                        <div class="emergency-card">
                            <div class="emergency-card-header">
                                <span class="emergency-id">${d.patientId}</span>
                                <span class="emergency-date">${date}</span>
                            </div>
                            <div class="emergency-name">${d.firstName} ${d.lastName}</div>
                            <div class="emergency-details">
                                <span><strong>Age:</strong> ${d.age}</span>
                                <span><strong>Gender:</strong> ${d.gender}</span>
                                <span><strong>Religion:</strong> ${d.religion || 'N/A'}</span>
                            </div>
                            <div class="emergency-reason">🚨 ${d.triage}</div>
                            <div class="emergency-action">
                                <span class="status-badge ${badgeClass}" style="margin-right: 10px;">${d.status}</span>
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });
            }
            // --- END OF RENDER CARDS ---

            // --- START OF FORM SUBMISSION & PIN GENERATION ---
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.textContent = 'Registering...'; btn.disabled = true;

                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const age = document.getElementById('age').value;
                const gender = document.getElementById('gender').value;
                const religion = document.getElementById('religion').value;
                const phone = document.getElementById('phone').value || 'N/A';
                const triage = document.getElementById('triage').value;

                try {
                    const counterRef = db.collection('settings').doc('counters');
                    let generatedPatientId = "";
                    let generatedPin = Math.floor(100000 + Math.random() * 900000).toString();

                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(counterRef);
                        let nextId = 1;
                        if (doc.exists && doc.data().lastPatientId) nextId = doc.data().lastPatientId + 1;
                        transaction.set(counterRef, { lastPatientId: nextId }, { merge: true });
                        generatedPatientId = `P${String(nextId).padStart(4, '0')}`;
                    });

                    // 1. Save to patients collection WITH PIN & RELIGION
                    await db.collection('patients').add({
                        patientId: generatedPatientId,
                        pin: generatedPin, 
                        firstName: firstName, lastName: lastName, age: age, gender: gender, 
                        religion: religion,
                        phone: phone,
                        address: "Emergency Intake",
                        registeredBy: user.uid,
                        treatmentStatus: 'Ongoing', 
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 2. Save to emergencies collection
                    await db.collection('emergencies').add({
                        patientId: generatedPatientId,
                        firstName: firstName, lastName: lastName, age: age, gender: gender,
                        religion: religion,
                        triage: triage, status: 'Active',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    logActivity(auth.currentUser, "Emergency Intake", `Patient ID: ${generatedPatientId}, Reason: ${triage}`);

                    showAlert("Patient Registered", `Emergency Patient Registered!<br><br>Patient ID: <strong>${generatedPatientId}</strong><br>Security PIN: <strong>${generatedPin}</strong><br><br>Please give this ID and PIN to the patient/parent to link their online portal.`, "✔️");
                    
                    form.reset();
                    btn.textContent = '🚨 Register Emergency Case'; btn.disabled = false;

                } catch (error) {
                    showAlert("Error", error.message, "❌");
                    btn.textContent = '🚨 Register Emergency Case'; btn.disabled = false;
                }
            });
            // --- END OF FORM SUBMISSION ---

            // --- START OF RESOLVE EMERGENCY ---
            window.resolveEmergency = function(docId, patientName, patientId) {
                showConfirm("Mark as Treated", `Has ${patientName} (${patientId}) been successfully treated/discharged?`, () => {
                    db.collection('emergencies').doc(docId).update({ status: 'Treated' })
                    .then(() => {
                        logActivity(auth.currentUser, "Emergency Treated", `Patient: ${patientName} (${patientId})`);
                        showAlert("Success", "Patient marked as treated.", "✔️");
                    }).catch(err => showAlert("Error", err.message, "❌"));
                });
            };
            // --- END OF RESOLVE EMERGENCY ---
        });
        // --- END OF EMERGENCY INITIALIZATION ---
    </script>
</body>
</html>
