<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header" style="border-bottom: 3px solid #dc2626; padding-bottom: 15px;">
                <h1 style="color: #dc2626;">🚨 Emergency Department</h1>
                <p>Fast-track patient intake and triage management.</p>
            </div>

            <!-- Emergency Registration Form -->
            <div class="form-card" style="border-left: 4px solid #dc2626;">
                <h3>Fast-Track Registration</h3>
                <form id="emergencyForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" required placeholder="John">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" required placeholder="Doe">
                        </div>
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" id="age" required placeholder="30">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" required>
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Phone Number (Optional)</label>
                            <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label style="color: #dc2626; font-weight: bold;">Triage Level / Emergency Reason</label>
                            <input type="text" id="triage" required placeholder="e.g. Severe bleeding, Heart attack, Road accident">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 250px; background-color: #dc2626;">🚨 Register Emergency Case</button>
                </form>
            </div>

            <!-- Filter Buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-primary filter-btn" data-filter="Active" style="flex: 1; background-color: #dc2626;">Active Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="Treated" style="flex: 1; border-color: #065f46; color: #065f46;">Treated Cases</button>
                <button class="btn btn-outline filter-btn" data-filter="All" style="flex: 1; border-color: #1e3a8a; color: #1e3a8a;">All Cases</button>
            </div>

            <!-- Emergency Cases Table -->
            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Emergency Records</h3>
            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Age / Gender</th>
                        <th>Triage Reason</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="emergencyTableBody">
                    <tr><td colspan="7" style="text-align:center; color:#888;">Loading emergency cases...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START EMERGENCY LOGIC ---
        enforceAuth(['admin', 'doctor', 'nurse', 'reception']);
        let allEmergencies = [];
        let currentFilter = 'Active'; // Default filter

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const tbody = document.getElementById('emergencyTableBody');
            const form = document.getElementById('emergencyForm');

            // Load all emergency cases
            db.collection('emergencies').onSnapshot((snapshot) => {
                allEmergencies = [];
                snapshot.forEach(doc => {
                    allEmergencies.push({ id: doc.id, ...doc.data() });
                });

                // Sort newest first
                allEmergencies.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                applyFilter(currentFilter);
            }, error => {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
            });

            // Filter Button Logic
            document.querySelectorAll('.filter-btn').forEach(btn => {
                // Set initial styles
                if (btn.getAttribute('data-filter') === currentFilter) {
                    btn.className = 'btn btn-primary filter-btn';
                    if (currentFilter === 'Active') btn.style.cssText = 'flex: 1; background-color: #dc2626;';
                }

                btn.addEventListener('click', (e) => {
                    currentFilter = e.target.getAttribute('data-filter');
                    
                    // Reset all buttons
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.className = 'btn btn-outline filter-btn';
                        b.style.cssText = 'flex: 1;';
                        if (b.getAttribute('data-filter') === 'Active') b.style.cssText = 'flex: 1; border-color: #dc2626; color: #dc2626;';
                        if (b.getAttribute('data-filter') === 'Treated') b.style.cssText = 'flex: 1; border-color: #065f46; color: #065f46;';
                        if (b.getAttribute('data-filter') === 'All') b.style.cssText = 'flex: 1; border-color: #1e3a8a; color: #1e3a8a;';
                    });
                    
                    // Highlight clicked
                    e.target.className = 'btn btn-primary filter-btn';
                    e.target.style.cssText = 'flex: 1;';
                    if (currentFilter === 'Active') e.target.style.backgroundColor = '#dc2626';

                    applyFilter(currentFilter);
                });
            });

            function applyFilter(filter) {
                let filtered = allEmergencies;
                if (filter !== 'All') {
                    filtered = allEmergencies.filter(e => e.status === filter);
                }

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">No ${filter} emergency cases found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                filtered.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { 
                        year: 'numeric', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', hour12: true 
                    }) : 'Just now';

                    const badgeClass = d.status === 'Treated' ? 'status-complete' : 'status-pending';
                    const actionHtml = d.status === 'Active' 
                        ? `<button class="btn btn-primary" onclick="resolveEmergency('${d.id}', '${d.firstName} ${d.lastName}', '${d.patientId}')">Mark Treated</button>`
                        : `<span style="color:#065f46; font-weight:bold;">Completed</span>`;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.firstName} ${d.lastName}</strong></td>
                            <td>${d.age} / ${d.gender}</td>
                            <td style="color: #dc2626; font-weight: bold;">${d.triage}</td>
                            <td><small>${date}</small></td>
                            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            }

            // Handle Fast-Track Registration
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.textContent = 'Registering...'; btn.disabled = true;

                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const age = document.getElementById('age').value;
                const gender = document.getElementById('gender').value;
                const phone = document.getElementById('phone').value || 'N/A';
                const triage = document.getElementById('triage').value;

                try {
                    const counterRef = db.collection('settings').doc('counters');
                    let generatedPatientId = "";

                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(counterRef);
                        let nextId = 1;
                        if (doc.exists && doc.data().lastPatientId) {
                            nextId = doc.data().lastPatientId + 1;
                        }
                        transaction.set(counterRef, { lastPatientId: nextId }, { merge: true });
                        generatedPatientId = `P${String(nextId).padStart(4, '0')}`;
                    });

                    // 1. Save to the main 'patients' collection
                    await db.collection('patients').add({
                        patientId: generatedPatientId,
                        firstName: firstName, lastName: lastName, age: age, gender: gender, phone: phone,
                        address: "Emergency Intake",
                        registeredBy: user.uid,
                        treatmentStatus: 'Ongoing', // Default status
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 2. Save to the 'emergencies' collection
                    await db.collection('emergencies').add({
                        patientId: generatedPatientId,
                        firstName: firstName, lastName: lastName, age: age, gender: gender,
                        triage: triage, status: 'Active',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    logActivity(auth.currentUser, "Emergency Intake", `Patient ID: ${generatedPatientId}, Reason: ${triage}`);

                    alert(`✅ Emergency Patient Registered!\n\nPatient ID: ${generatedPatientId}\nName: ${firstName} ${lastName}`);
                    form.reset();
                    btn.textContent = '🚨 Register Emergency Case'; btn.disabled = false;

                } catch (error) {
                    console.error("Emergency Reg Error:", error);
                    alert("Error: " + error.message);
                    btn.textContent = '🚨 Register Emergency Case'; btn.disabled = false;
                }
            });

            // Mark Emergency as Treated
            window.resolveEmergency = function(docId, patientName, patientId) {
                if (confirm(`Has ${patientName} (${patientId}) been successfully treated/discharged from Emergency?`)) {
                    db.collection('emergencies').doc(docId).update({ status: 'Treated' })
                    .then(() => {
                        logActivity(auth.currentUser, "Emergency Treated", `Patient: ${patientName} (${patientId})`);
                        alert('Patient marked as treated.');
                    })
                    .catch(err => alert("Error: " + err.message));
                }
            };
        });
        // --- END EMERGENCY LOGIC ---
    </script>
</body>
</html>
