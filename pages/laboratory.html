<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧪 Laboratory</h1>
                <p>Manage test requests and input results.</p>
            </div>

            <div class="form-card">
                <h3>New Lab Request (Walk-in)</h3>
                <form id="labForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <input type="text" id="searchLabPatient" placeholder="Type Name, P ID, or Phone..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px;">
                            <select id="labPatientSelect" required style="display: none; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></select>
                        </div>
                        <div class="form-group">
                            <label>Test Type</label>
                            <select id="testType" required>
                                <option value="">Loading tests...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Requested By</label>
                            <input type="text" id="requestedBy" required placeholder="Doctor's Name / Walk-in">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Send to Lab</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Laboratory Queue</h3>
            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Test Type</th>
                        <th>Requested By</th>
                        <th>Status</th>
                        <th>Result / Action</th>
                    </tr>
                </thead>
                <tbody id="labTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading lab requests...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js?v=110"></script>

    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = '../login.html'; return; }

            const tbody = document.getElementById('labTableBody');
            const searchLabPatient = document.getElementById('searchLabPatient');
            const labPatientSelect = document.getElementById('labPatientSelect');
            let allPatients = [];

            db.collection('patients').get().then(snap => {
                snap.forEach(doc => allPatients.push(doc.data()));
            });

            db.collection('labTests').get().then(snap => {
                const testSelect = document.getElementById('testType');
                testSelect.innerHTML = '<option value="">Select test...</option>';
                snap.forEach(doc => testSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });

            searchLabPatient.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                if (term.length < 2) { labPatientSelect.style.display = 'none'; return; }
                const filtered = allPatients.filter(p => {
                    const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    const phone = String(p.phone).toLowerCase();
                    return name.includes(term) || pid.includes(term) || phone.includes(term);
                });
                labPatientSelect.innerHTML = '<option value="">Select patient...</option>';
                filtered.forEach(p => labPatientSelect.innerHTML += `<option value="${p.patientId}" data-name="${p.firstName} ${p.lastName}">${p.patientId} - ${p.firstName} ${p.lastName}</option>`);
                labPatientSelect.style.display = filtered.length > 0 ? 'block' : 'none';
            });

            db.collection('labResults').onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No lab requests in the queue.</td></tr>`;
                    return;
                }
                
                let results = [];
                snapshot.forEach(doc => results.push({ id: doc.id, ...doc.data() }));
                results.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                tbody.innerHTML = '';
                results.forEach(d => {
                    const badgeClass = d.status === 'Completed' ? 'status-complete' : 'status-pending';
                    let actionHtml = '';
                    
                    if (d.status === 'Pending') {
                        actionHtml = `<div style="display:flex; gap:5px;"><input type="text" id="result_${d.id}" placeholder="Result..." style="padding:5px; border:1px solid #ccc; border-radius:3px; width:100px;"><button class="btn btn-primary" onclick="saveResult('${d.id}')">Save</button></div>`;
                    } else {
                        actionHtml = `<strong>${d.result}</strong>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:#2563eb;">${d.patientId}</strong></td>
                            <td><strong>${d.patientName}</strong></td>
                            <td>${d.testType}</td>
                            <td>${d.doctorName || d.requestedBy || 'Walk-in'}</td>
                            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                            <td>${actionHtml}</td>
                        </tr>
                    `;
                });
            });

            document.getElementById('labForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!labPatientSelect.value) { alert("Please select a patient."); return; }
                
                const patientId = labPatientSelect.value;
                const patientName = labPatientSelect.options[labPatientSelect.selectedIndex].getAttribute('data-name');
                
                db.collection('labResults').add({
                    patientId: patientId,
                    patientName: patientName,
                    testType: document.getElementById('testType').value,
                    requestedBy: document.getElementById('requestedBy').value,
                    status: 'Pending', result: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert('Lab test requested!');
                    document.getElementById('labForm').reset();
                    labPatientSelect.style.display = 'none';
                });
            });

            window.saveResult = function(docId) {
                const resultInput = document.getElementById(`result_${docId}`).value;
                if (!resultInput) { alert("Please enter a result."); return; }
                db.collection('labResults').doc(docId).update({ result: resultInput, status: 'Completed' })
                .then(() => alert('Result saved!'));
            };
        });
    </script>
</body>
</html>
