<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧪 Laboratory</h1>
                <p>Manage test requests and input results.</p>
            </div>

            <a href="../dashboard.html" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block;">⬅️ Back to Dashboard</a>

            <div class="form-card">
                <h3>New Lab Request (Walk-in)</h3>
                <form id="labForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient</label>
                            <div class="autocomplete-container">
                                <input type="text" id="patientSearchInput" placeholder="Type Name, P ID..." autocomplete="off">
                                <div id="autocompleteList" class="autocomplete-list"></div>
                                <input type="hidden" id="selectedPatientId">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Test Type</label>
                            <select id="testType" required><option value="">Loading tests...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Requested By</label>
                            <input type="text" id="requestedBy" required placeholder="Doctor / Walk-in">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 200px;">Send to Lab</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Laboratory Queue</h3>
            <div id="labCardContainer" class="med-grid">
                <p style="text-align: center; width: 100%; color:#888;">Loading requests...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        enforceAuth(['lab']);
        auth.onAuthStateChanged((user) => {
            if (!user) return;
            const searchInput = document.getElementById('patientSearchInput');
            const autocompleteList = document.getElementById('autocompleteList');
            const hiddenPatientId = document.getElementById('selectedPatientId');
            const cardContainer = document.getElementById('labCardContainer');
            let debounceTimer;

            // Search Logic (ID and Name)
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                clearTimeout(debounceTimer);
                hiddenPatientId.value = ""; searchInput.dataset.name = "";
                autocompleteList.style.display = 'none';
                if (term.length < 2) return; 

                debounceTimer = setTimeout(async () => {
                    autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">Searching...</div>';
                    autocompleteList.style.display = 'block';
                    let results = []; let seenIds = new Set();

                    try {
                        const idSnap = await db.collection('patients').where('patientId', '==', term.toUpperCase()).get();
                        idSnap.forEach(doc => { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); });
                    } catch (e) {}

                    try {
                        const st = term.charAt(0).toUpperCase() + term.slice(1).toLowerCase();
                        const nameSnap = await db.collection('patients').orderBy('firstName').startAt(st).endAt(st + '\uf8ff').limit(10).get();
                        nameSnap.forEach(doc => { if (!seenIds.has(doc.id)) { results.push({ firestoreId: doc.id, ...doc.data() }); seenIds.add(doc.id); } });
                    } catch (e) {}

                    autocompleteList.innerHTML = results.length === 0 ? '<div style="padding: 10px; color: #888;">No matches.</div>' : '';
                    results.forEach(p => {
                        const div = document.createElement('div');
                        div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                        div.onclick = () => {
                            searchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                            hiddenPatientId.value = p.patientId; searchInput.dataset.name = `${p.firstName} ${p.lastName}`;
                            autocompleteList.style.display = 'none';
                        };
                        autocompleteList.appendChild(div);
                    });
                }, 300);
            });
            document.addEventListener('click', (e) => { if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none'; });

            // Load Tests Dropdown
            db.collection('labTests').get().then(snap => {
                const testSelect = document.getElementById('testType');
                snap.forEach(doc => testSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });

            // Load Cards
            db.collection('labResults').orderBy('createdAt', 'desc').limit(50).onSnapshot((snapshot) => {
                if (snapshot.empty) { cardContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No lab requests.</p>`; return; }
                let results = []; snapshot.forEach(doc => results.push({ id: doc.id, ...doc.data() }));
                cardContainer.innerHTML = '';
                
                results.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    const badgeClass = d.status === 'Completed' ? 'status-complete' : 'status-pending';
                    let actionHtml = d.status === 'Pending' 
                        ? `<div style="display:flex; gap:5px;"><input type="text" id="result_${d.id}" placeholder="Result..." style="padding:5px; border:1px solid #ccc; border-radius:3px; width:100px;"><button class="btn btn-primary" onclick="saveResult('${d.id}')">Save</button></div>`
                        : `<strong>${d.result}</strong>`;

                    cardContainer.innerHTML += `
                        <div class="med-card">
                            <div class="med-header">
                                <span class="med-id">${d.patientId}</span>
                                <span class="med-date">${date}</span>
                            </div>
                            <div class="med-name">${d.patientName}</div>
                            <div class="med-info">
                                <strong>Test:</strong> ${d.testType}<br>
                                <strong>Requested By:</strong> ${d.doctorName || d.requestedBy || 'Walk-in'}
                            </div>
                            <div class="med-action">
                                <span class="status-badge ${badgeClass}">${d.status}</span>
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });
            });

            // Submit
            document.getElementById('labForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(!hiddenPatientId.value) { showAlert("Error", "Please select a patient.", "❌"); return; }
                db.collection('labResults').add({
                    patientId: hiddenPatientId.value, patientName: searchInput.dataset.name,
                    testType: document.getElementById('testType').value, requestedBy: document.getElementById('requestedBy').value,
                    status: 'Pending', result: '', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showAlert("Success", "Lab test requested!", "✔️"); 
                    document.getElementById('labForm').reset(); searchInput.value = ''; hiddenPatientId.value = '';
                });
            });

            window.saveResult = function(docId) {
                const resultInput = document.getElementById(`result_${docId}`).value;
                if (!resultInput) { showAlert("Error", "Please enter a result.", "❌"); return; }
                db.collection('labResults').doc(docId).update({ result: resultInput, status: 'Completed' }).then(() => showAlert("Success", "Result saved!", "✔️"));
            };
        });
    </script>
</body>
</html>
