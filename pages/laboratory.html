<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🧪 Laboratory</h1>
                <p>Blood tests, urine tests, and diagnostic reports.</p>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="alert('Feature coming: New lab request')">+ New Lab Request</button>
            </div>
            <table>
                <thead>
                    <tr><th>Patient</th><th>Test Type</th><th>Requested By</th><th>Status</th><th>Result</th><th>Action</th></tr>
                </thead>
                <tbody id="labTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading lab requests...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../script.js"></script>
    <script src="../js/departments.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => loadDepartmentData('laboratory'));
    </script>
</body>
</html>
