<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🩺 General Medicine / OPD</h1>
                <p>Outpatient Department — patient queue and consultations.</p>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="alert('Feature coming: Register new OPD visit')">+ New OPD Visit</button>
            </div>
            <table>
                <thead>
                    <tr><th>Patient ID</th><th>Name</th><th>Age</th><th>Doctor</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="opdTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading patients...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../script.js"></script>
    <script src="../js/departments.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => loadDepartmentData('opd'));
    </script>
</body>
</html>
