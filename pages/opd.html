<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD / Doctor - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🩺 General Medicine / OPD</h1>
                <p>Doctor consultation, diagnosis, and routing to departments.</p>
            </div>

            <!-- SMART BACK BUTTON -->
            <button onclick="goBack()" class="btn btn-outline" style="border-color: #1e3a8a; color: #1e3a8a; margin-bottom: 20px; display: inline-block; cursor: pointer;">⬅️ Back</button>

            <div class="form-card">
                <h3>New Consultation</h3>
                <form id="opdForm">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient (Name, P ID, or Phone)</label>
                            <div class="autocomplete-container">
                                <input type="text" id="patientSearchInput" placeholder="Type to search..." autocomplete="off">
                                <div id="autocompleteList" class="autocomplete-list"></div>
                                <input type="hidden" id="selectedPatientId">
                            </div>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Presenting Symptoms</label>
                            <textarea id="symptoms" rows="2" required placeholder="e.g. Fever, headache..."></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Diagnosis</label>
                            <input type="text" id="diagnosis" required placeholder="e.g. Malaria, Typhoid">
                        </div>
                    </div>

                    <h4 style="margin-top: 20px; margin-bottom: 10px; color: #1e3a8a;">Send Patient To:</h4>
                    <div style="display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;">
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkPharmacy" onchange="toggleFields()"> Pharmacy
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkLab" onchange="toggleFields()"> Laboratory
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkRadiology" onchange="toggleFields()"> Radiology
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkBilling" onchange="toggleFields()"> Billing Dept
                        </label>
                    </div>

                    <div id="pharmacyFields" style="display:none;" class="form-group">
                        <label>Prescription (Medications)</label>
                        <textarea id="prescription" rows="2" placeholder="e.g. Artemether-Lumefantrine..."></textarea>
                    </div>

                    <div id="labFields" style="display:none;" class="form-group">
                        <label>Lab Test Required</label>
                        <select id="labTest"><option value="">Select test...</option></select>
                    </div>

                    <div id="radiologyFields" style="display:none;" class="form-group">
                        <label>Radiology Scan Required</label>
                        <select id="radiologyScan"><option value="">Select scan...</option></select>
                    </div>

                    <div id="billingFields" style="display:none;" class="form-group">
                        <label>Consultation Fee (₦)</label>
                        <input type="number" id="consultationFee" value="5000" placeholder="Enter amount">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 250px;">Save & Send Requests</button>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Consultation History</h3>
            
            <!-- HISTORY CARDS CONTAINER -->
            <div id="opdHistoryCardContainer" class="card-grid-layout">
                <p style="text-align:center; width:100%; color:#888;">Loading history...</p>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js"></script>

    <script>
        // --- START OF OPD INITIALIZATION ---
        enforceAuth(['doctor']);
        
        window.toggleFields = function() {
            document.getElementById('pharmacyFields').style.display = document.getElementById('chkPharmacy').checked ? 'block' : 'none';
            document.getElementById('labFields').style.display = document.getElementById('chkLab').checked ? 'block' : 'none';
            document.getElementById('radiologyFields').style.display = document.getElementById('chkRadiology').checked ? 'block' : 'none';
            document.getElementById('billingFields').style.display = document.getElementById('chkBilling').checked ? 'block' : 'none';
        };

        auth.onAuthStateChanged((user) => {
            if (!user) return;

            const searchInput = document.getElementById('patientSearchInput');
            const autocompleteList = document.getElementById('autocompleteList');
            const hiddenPatientId = document.getElementById('selectedPatientId');
            const historyContainer = document.getElementById('opdHistoryCardContainer');
            let debounceTimer;

            // --- START OF SCALABLE SERVER-SIDE SEARCH ---
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                clearTimeout(debounceTimer);
                hiddenPatientId.value = "";
                searchInput.dataset.name = "";
                autocompleteList.style.display = 'none';

                if (term.length < 2) return; 

                debounceTimer = setTimeout(async () => {
                    autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">Searching...</div>';
                    autocompleteList.style.display = 'block';

                    const searchTerm = term.charAt(0).toUpperCase() + term.slice(1);
                    const upperTerm = term.toUpperCase();

                    const nameQuery = db.collection('patients')
                        .orderBy('firstName')
                        .startAt(searchTerm)
                        .endAt(searchTerm + '\uf8ff')
                        .limit(10)
                        .get();

                    const idQuery = db.collection('patients')
                        .where('patientId', '==', upperTerm)
                        .get();

                    Promise.all([nameQuery, idQuery]).then(([nameSnap, idSnap]) => {
                        let results = [];
                        let seenIds = new Set();

                        nameSnap.forEach(doc => {
                            results.push({ firestoreId: doc.id, ...doc.data() });
                            seenIds.add(doc.id);
                        });

                        idSnap.forEach(doc => {
                            if (!seenIds.has(doc.id)) {
                                results.push({ firestoreId: doc.id, ...doc.data() });
                                seenIds.add(doc.id);
                            }
                        });

                        renderDropdown(results);
                    }).catch(error => {
                        console.error("Search Error:", error);
                        autocompleteList.innerHTML = `<div style="padding: 10px; color: red; font-size: 12px;">Search error. Check console for index link.</div>`;
                    });
                }, 600); 
            });

            function renderDropdown(patients) {
                autocompleteList.innerHTML = '';
                if (patients.length === 0) { 
                    autocompleteList.innerHTML = '<div style="padding: 10px; color: #888;">No matching patients found.</div>';
                    return; 
                }
                
                patients.forEach(p => {
                    const div = document.createElement('div');
                    div.innerHTML = `<strong>${p.firstName} ${p.lastName}</strong> (ID: ${p.patientId})`;
                    div.addEventListener('click', () => {
                        searchInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
                        hiddenPatientId.value = p.patientId;
                        searchInput.dataset.name = `${p.firstName} ${p.lastName}`; 
                        autocompleteList.style.display = 'none';
                    });
                    autocompleteList.appendChild(div);
                });
            }

            document.addEventListener('click', (e) => {
                if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none';
            });
            // --- END OF SCALABLE SERVER-SIDE SEARCH ---

            // --- START OF LOAD DYNAMIC SERVICES ---
            db.collection('labTests').get().then(snap => {
                const labSelect = document.getElementById('labTest');
                snap.forEach(doc => labSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });
            db.collection('radiologyScans').get().then(snap => {
                const radSelect = document.getElementById('radiologyScan');
                snap.forEach(doc => radSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });
            // --- END OF LOAD DYNAMIC SERVICES ---

            // --- START OF LOAD CONSULTATION HISTORY (CARD FORMAT) ---
            db.collection('consultations').orderBy('createdAt', 'desc').limit(50).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    historyContainer.innerHTML = `<p style="text-align:center; width:100%; color:#888;">No consultations recorded yet.</p>`;
                    return;
                }
                let consults = []; 
                snapshot.forEach(doc => consults.push({ id: doc.id, ...doc.data() }));
                
                historyContainer.innerHTML = '';
                consults.forEach(d => {
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : 'Just now';
                    
                    let badges = '';
                    if (d.requests && d.requests.pharmacy) badges += `<span class="status-badge status-pending" style="margin-bottom: 2px;">💊 ${d.requests.pharmacy}</span><br>`;
                    if (d.requests && d.requests.lab) badges += `<span class="status-badge status-active" style="margin-bottom: 2px;">🧪 ${d.requests.lab}</span><br>`;
                    if (d.requests && d.requests.radiology) badges += `<span class="status-badge status-complete" style="margin-bottom: 2px;">🩻 ${d.requests.radiology}</span><br>`;
                    if (d.requests && d.requests.billing) badges += `<span class="status-badge status-pending" style="margin-bottom: 2px;">💳 ₦${d.requests.billing}</span><br>`;
                    if (!badges) badges = '<span style="color:#888;">None</span>';

                    historyContainer.innerHTML += `
                        <div class="data-card">
                            <div class="data-card-header">
                                <span class="data-id">${d.patientId}</span>
                                <span class="data-date">${date}</span>
                            </div>
                            <div class="data-name">${d.patientName}</div>
                            <div class="data-info" style="margin-top:10px; background:#fff;">
                                <strong>Diagnosis:</strong> ${d.diagnosis}<br>
                                <strong>Doctor:</strong> ${d.doctorName || 'Unknown'}<br>
                                <div style="margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 10px;">
                                    <strong>Routed To:</strong><br>
                                    ${badges}
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
            // --- END OF LOAD CONSULTATION HISTORY ---

            // --- START OF FORM SUBMISSION ---
            document.getElementById('opdForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                
                if (!hiddenPatientId.value) { showAlert("Error", "Please search and select a patient from the dropdown.", "❌"); return; }
                btn.textContent = 'Saving...'; btn.disabled = true;

                const patientId = hiddenPatientId.value; 
                const patientName = searchInput.dataset.name;
                const reqPharmacy = document.getElementById('chkPharmacy').checked;
                const reqLab = document.getElementById('chkLab').checked;
                const reqRadiology = document.getElementById('chkRadiology').checked;
                const reqBilling = document.getElementById('chkBilling').checked;
                const billingAmount = document.getElementById('consultationFee').value;

                try {
                    const doctorDoc = await db.collection('users').doc(user.uid).get();
                    const docData = doctorDoc.data() || {};
                    const doctorName = `Dr. ${docData.firstName || 'Unknown'} ${docData.lastName || ''}`;
                    const doctorStaffId = docData.staffId || 'N/A';

                    await db.collection('consultations').add({
                        patientId, patientName, symptoms: document.getElementById('symptoms').value, diagnosis: document.getElementById('diagnosis').value, doctorId: user.uid, doctorName, doctorStaffId,
                        requests: { 
                            pharmacy: reqPharmacy ? document.getElementById('prescription').value : null, 
                            lab: reqLab ? document.getElementById('labTest').value : null, 
                            radiology: reqRadiology ? document.getElementById('radiologyScan').value : null,
                            billing: reqBilling ? billingAmount : null
                        },
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    if (reqPharmacy) await db.collection('prescriptions').add({ patientId, patientName, medication: document.getElementById('prescription').value, doctorId: user.uid, doctorName, doctorStaffId, status: 'Pending', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    if (reqLab) await db.collection('labResults').add({ patientId, patientName, testType: document.getElementById('labTest').value, doctorId: user.uid, doctorName, doctorStaffId, status: 'Pending', result: '', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    if (reqRadiology) await db.collection('radiology').add({ patientId, patientName, scanType: document.getElementById('radiologyScan').value, doctorId: user.uid, doctorName, doctorStaffId, status: 'Pending', result: '', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    
                    if (reqBilling) {
                        await db.collection('bills').add({
                            patientId: patientId, patientName: patientName,
                            service: `OPD Consultation - ${document.getElementById('diagnosis').value}`, 
                            amount: billingAmount, status: 'Pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }

                    showAlert("Success", "Consultation saved and requests routed!", "✔️");
                    document.getElementById('opdForm').reset(); toggleFields(); searchInput.value = ''; hiddenPatientId.value = '';
                    btn.textContent = 'Save & Send Requests'; btn.disabled = false;
                } catch (error) {
                    showAlert("Error", error.message, "❌");
                    btn.textContent = 'Save & Send Requests'; btn.disabled = false;
                }
            });
            // --- END OF FORM SUBMISSION ---
        });
        // --- END OF OPD INITIALIZATION ---
    </script>
</body>
</html>
