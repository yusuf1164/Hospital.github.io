<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD / Doctor - DEEN Hospital</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="table-container">
            <div class="page-header">
                <h1>🩺 General Medicine / OPD</h1>
                <p>Doctor consultation, diagnosis, and routing to departments.</p>
            </div>

            <div class="form-card">
                <h3>New Consultation</h3>
                <form id="opdForm">
                    <div class="form-grid">
                        <!-- SEARCH BAR FOR PATIENT -->
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Search Patient (Name, P ID, or Phone)</label>
                            <input type="text" id="searchPatient" placeholder="Type to search..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px;">
                            <select id="patientSelect" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; display: none;">
                                <option value="">Select matching patient...</option>
                            </select>
                        </div>

                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Presenting Symptoms</label>
                            <textarea id="symptoms" rows="2" required placeholder="e.g. Fever, headache..."></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Diagnosis</label>
                            <input type="text" id="diagnosis" required placeholder="e.g. Malaria, Typhoid">
                        </div>
                    </div>

                    <h4 style="margin-top: 20px; margin-bottom: 10px; color: #1e3a8a;">Send Patient To:</h4>
                    <div style="display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;">
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkPharmacy" onchange="toggleFields()"> Pharmacy
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkLab" onchange="toggleFields()"> Laboratory
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="chkRadiology" onchange="toggleFields()"> Radiology
                        </label>
                    </div>

                    <div id="pharmacyFields" style="display:none;" class="form-group">
                        <label>Prescription (Medications)</label>
                        <textarea id="prescription" rows="2" placeholder="e.g. Artemether-Lumefantrine..."></textarea>
                    </div>

                    <div id="labFields" style="display:none;" class="form-group">
                        <label>Lab Test Required</label>
                        <select id="labTest" required>
                            <option value="">Loading tests...</option>
                        </select>
                    </div>

                    <div id="radiologyFields" style="display:none;" class="form-group">
                        <label>Radiology Scan Required</label>
                        <select id="radiologyScan" required>
                            <option value="">Loading scans...</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn" style="margin-top: 15px; max-width: 250px;">Save & Send Requests</button>
                    <div id="formError" class="error-message" style="margin-top: 10px;"></div>
                </form>
            </div>

            <h3 style="color: #1e3a8a; margin-bottom: 15px;">Consultation History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Patient (ID)</th>
                        <th>Diagnosis</th>
                        <th>Routed To</th>
                    </tr>
                </thead>
                <tbody id="opdHistoryBody">
                    <tr><td colspan="4" style="text-align:center; color:#888;">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../script.js?v=105"></script>

    <script>
        window.toggleFields = function() {
            document.getElementById('pharmacyFields').style.display = document.getElementById('chkPharmacy').checked ? 'block' : 'none';
            document.getElementById('labFields').style.display = document.getElementById('chkLab').checked ? 'block' : 'none';
            document.getElementById('radiologyFields').style.display = document.getElementById('chkRadiology').checked ? 'block' : 'none';
        };

        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = '../login.html'; return; }

            const searchPatient = document.getElementById('searchPatient');
            const patientSelect = document.getElementById('patientSelect');
            const historyBody = document.getElementById('opdHistoryBody');
            let allPatients = [];

            // Load Patients
            db.collection('patients').get().then((snapshot) => {
                snapshot.forEach(doc => {
                    allPatients.push({ firestoreId: doc.id, ...doc.data() });
                });
            });

            // Search Logic
            searchPatient.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                if (term.length < 2) { patientSelect.style.display = 'none'; return; }

                const filtered = allPatients.filter(p => {
                    const name = `${p.firstName} ${p.lastName}`.toLowerCase();
                    const pid = String(p.patientId).toLowerCase();
                    const phone = String(p.phone).toLowerCase();
                    return name.includes(term) || pid.includes(term) || phone.includes(term);
                });

                patientSelect.innerHTML = '<option value="">Select patient...</option>';
                filtered.forEach(p => {
                    patientSelect.innerHTML += `<option value="${p.patientId}">${p.patientId} - ${p.firstName} ${p.lastName} (${p.phone})</option>`;
                });
                patientSelect.style.display = filtered.length > 0 ? 'block' : 'none';
            });

            // Load Services
            db.collection('labTests').get().then(snap => {
                const labSelect = document.getElementById('labTest');
                labSelect.innerHTML = '<option value="">Select test...</option>';
                snap.forEach(doc => labSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });

            db.collection('radiologyScans').get().then(snap => {
                const radSelect = document.getElementById('radiologyScan');
                radSelect.innerHTML = '<option value="">Select scan...</option>';
                snap.forEach(doc => radSelect.innerHTML += `<option value="${doc.data().name}">${doc.data().name}</option>`);
            });

            // Load History
            db.collection('consultations').orderBy('createdAt', 'desc').limit(20).onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    historyBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">No consultations recorded yet.</td></tr>`;
                    return;
                }
                historyBody.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const date = d.createdAt ? d.createdAt.toDate().toLocaleString() : 'Just now';
                    
                    let routedTo = [];
                    if (d.requests && d.requests.pharmacy) routedTo.push(`<span class="status-badge status-pending" style="margin-right:5px;">💊 ${d.requests.pharmacy}</span>`);
                    if (d.requests && d.requests.lab) routedTo.push(`<span class="status-badge status-active" style="margin-right:5px;">🧪 ${d.requests.lab}</span>`);
                    if (d.requests && d.requests.radiology) routedTo.push(`<span class="status-badge status-complete" style="margin-right:5px;">🩻 ${d.requests.radiology}</span>`);
                    if (routedTo.length === 0) routedTo.push("None");

                    historyBody.innerHTML += `
                        <tr>
                            <td><small>${date}</small></td>
                            <td><strong>${d.patientName}</strong><br><small style="color:#2563eb;">${d.patientId}</small></td>
                            <td>${d.diagnosis}</td>
                            <td>${routedTo.join('')}</td>
                        </tr>
                    `;
                });
            });

            // Submit Form
            const form = document.getElementById('opdForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const errorDiv = document.getElementById('formError');
                
                if (!patientSelect.value) {
                    alert("Please search and select a patient.");
                    return;
                }

                btn.textContent = 'Saving...'; btn.disabled = true; errorDiv.style.display = 'none';

                const patientId = patientSelect.value; // This is now P0001
                const patientName = patientSelect.options[patientSelect.selectedIndex].text.split(' - ')[1].split(' (')[0];
                const symptoms = document.getElementById('symptoms').value;
                const diagnosis = document.getElementById('diagnosis').value;
                const doctorId = user.uid;

                const reqPharmacy = document.getElementById('chkPharmacy').checked;
                const reqLab = document.getElementById('chkLab').checked;
                const reqRadiology = document.getElementById('chkRadiology').checked;

                const pharmVal = document.getElementById('prescription').value;
                const labVal = document.getElementById('labTest').value;
                const radVal = document.getElementById('radiologyScan').value;

                db.collection('users').doc(doctorId).get().then(doctorDoc => {
                    const docData = doctorDoc.data() || {};
                    const doctorName = `Dr. ${docData.firstName || 'Unknown'} ${docData.lastName || ''}`;
                    const doctorStaffId = docData.staffId || 'N/A';

                    let promises = [];

                    promises.push(db.collection('consultations').add({
                        patientId, patientName, symptoms, diagnosis, 
                        doctorId, doctorName, doctorStaffId,
                        requests: {
                            pharmacy: reqPharmacy ? pharmVal : null,
                            lab: reqLab ? labVal : null,
                            radiology: reqRadiology ? radVal : null
                        },
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }));

                    if (reqPharmacy) {
                        promises.push(db.collection('prescriptions').add({
                            patientId, patientName, medication: pharmVal,
                            doctorId, doctorName, doctorStaffId,
                            status: 'Pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }));
                    }
                    if (reqLab) {
                        promises.push(db.collection('labResults').add({
                            patientId, patientName, testType: labVal,
                            doctorId, doctorName, doctorStaffId,
                            status: 'Pending', result: '',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }));
                    }
                    if (reqRadiology) {
                        promises.push(db.collection('radiology').add({
                            patientId, patientName, scanType: radVal,
                            doctorId, doctorName, doctorStaffId,
                            status: 'Pending', result: '',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }));
                    }

                    return Promise.all(promises);
                }).then(() => {
                    alert('Consultation saved and requests routed!');
                    form.reset(); toggleFields(); searchPatient.value = ''; patientSelect.style.display = 'none';
                    btn.textContent = 'Save & Send Requests'; btn.disabled = false;
                }).catch((error) => {
                    errorDiv.style.display = 'block'; errorDiv.textContent = "Error: " + error.message;
                    btn.textContent = 'Save & Send Requests'; btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
