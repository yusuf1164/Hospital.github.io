<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal Registration - DEEN Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="form-container">
            <h2>Patient Portal Registration</h2>
            <p>Create an account to manage your health records online.</p>
            
            <form id="patientRegisterForm">
                <div class="form-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" required placeholder="John">
                </div>
                <div class="form-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" required placeholder="Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                    <div id="passwordError" class="error-message">Passwords do not match.</div>
                </div>
                
                <button type="submit" class="btn-submit" id="registerBtn">Create Patient Account</button>
                <div id="registerError" class="error-message" style="text-align:center; margin-top:10px;"></div>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="script.js"></script>

    <script>
        // We put this directly in the page so it doesn't conflict with staff registration
        document.getElementById('patientRegisterForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('firstname').value;
            const lastName = document.getElementById('lastname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            const passwordError = document.getElementById('passwordError');
            const registerError = document.getElementById('registerError');
            const btn = document.getElementById('registerBtn');

            if (password !== confirm) {
                passwordError.style.display = 'block';
                return;
            }
            passwordError.style.display = 'none';
            btn.textContent = 'Creating Account...'; btn.disabled = true;

            // 1. Create Auth User
            auth.createUserWithEmailAndPassword(email, password)
                .then((cred) => {
                    // 2. Save as a Patient (No staffId)
                    return db.collection('users').doc(cred.user.uid).set({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        roles: ['patient'], // Strictly patient
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert('Patient Account Created Successfully!');
                    window.location.href = 'dashboard.html';
                })
                .catch(err => {
                    registerError.style.display = 'block';
                    registerError.textContent = err.message;
                    btn.textContent = 'Create Patient Account'; 
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
