<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal Registration - DEEN Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <div class="form-container" style="max-width: 600px;">
            <h2>Patient Portal Registration</h2>
            <p>Create an account to manage your health records online.</p>
            
            <form id="patientRegisterForm">
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    
                    <!-- DATE OF BIRTH REPLACES AGE -->
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                        <div id="ageDisplay" style="font-size: 14px; color: #2563eb; font-weight: bold; margin-top: 5px;"></div>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- RELIGION FIELD -->
                <div class="form-group">
                    <label for="religion">Religion</label>
                    <select id="religion" required>
                        <option value="">Select...</option>
                        <option value="Islam">Islam</option>
                        <option value="Christianity">Christianity</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" required placeholder="123 Main St">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                    <div id="passwordError" class="error-message">Passwords do not match.</div>
                </div>
                
                <button type="submit" class="btn-submit" id="registerBtn">Create Patient Account</button>
                <div id="registerError" class="error-message" style="text-align:center; margin-top:10px;"></div>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="script.js"></script>

    <script>
        // --- ADDED: Live age calculation listener ---
        document.getElementById('dob').addEventListener('change', function() {
            const age = calculateAge(this.value);
            document.getElementById('ageDisplay').textContent = age !== "" ? `Calculated Age: ${age} years old` : "";
        });

        document.getElementById('patientRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('firstname').value;
            const lastName = document.getElementById('lastname').value;
            const dob = document.getElementById('dob').value; // CHANGED TO DOB
            const gender = document.getElementById('gender').value;
            const religion = document.getElementById('religion').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            const passwordError = document.getElementById('passwordError');
            const registerError = document.getElementById('registerError');
            const btn = document.getElementById('registerBtn');

            if (password !== confirm) {
                passwordError.style.display = 'block';
                return;
            }
            passwordError.style.display = 'none';
            registerError.style.display = 'none';
            
            // --- ADDED: Calculate age to save in DB ---
            const calculatedAge = calculateAge(dob);

            btn.textContent = 'Creating Account...'; btn.disabled = true;

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const counterRef = db.collection('settings').doc('counters');
                let generatedPatientId = "";
                let generatedPin = Math.floor(100000 + Math.random() * 900000).toString();

                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(counterRef);
                    let nextId = 1;
                    if (doc.exists && doc.data().lastPatientId) {
                        nextId = doc.data().lastPatientId + 1;
                    }
                    transaction.set(counterRef, { lastPatientId: nextId }, { merge: true });
                    generatedPatientId = `P${String(nextId).padStart(4, '0')}`;
                });

                await db.collection('patients').add({
                    patientId: generatedPatientId,
                    pin: generatedPin,
                    firstName: firstName,
                    lastName: lastName,
                    dob: dob, // SAVED TO DB
                    age: calculatedAge, // SAVED CALCULATED AGE TO DB
                    gender: gender,
                    religion: religion,
                    phone: phone,
                    email: email,
                    address: address,
                    registeredBy: cred.user.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await db.collection('users').doc(cred.user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    phone: phone,
                    roles: ['patient'],
                    linkedPatientIds: [generatedPatientId],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert(`✔️ Patient Account Created Successfully!\n\nPatient ID: ${generatedPatientId}\nSecurity PIN: ${generatedPin}\n\nPlease save this ID and PIN. You will need it for your hospital visits.`);
                window.location.href = 'dashboard.html';

            } catch (err) {
                registerError.style.display = 'block';
                registerError.textContent = "Error: " + err.message;
                btn.textContent = 'Create Patient Account';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
