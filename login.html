<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DEEN Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header-placeholder"></header>
    <main>
        <div class="form-container">
            <h2>Login</h2>
            <p>Access your account.</p>
            
            <!-- SUCCESS MESSAGE FOR VERIFICATION -->
            <div id="verifySuccessMsg" style="display:none; background: #d1fae5; color: #065f46; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; text-align: center;">
                Registration successful! Please check your email inbox to verify your account.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
                <div id="loginError" class="error-message" style="text-align:center; margin-top:10px;"></div>
            </form>
            
            <!-- RESEND VERIFICATION BUTTON (Hidden by default) -->
            <div id="resendSection" style="display:none; text-align: center; margin-top: 15px;">
                <p style="font-size: 13px; color: #666;">Didn't receive the email?</p>
                <button id="resendBtn" class="btn btn-outline" style="border-color: #f59e0b; color: #f59e0b; margin-top: 5px; width: 100%;">Resend Verification Email</button>
            </div>

            <div class="form-footer">
                Don't have an account? <a href="choose-register.html">Register here</a>
            </div>
        </div>
    </main>
    <footer id="footer-placeholder"></footer>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="script.js"></script>
</body>
</html>
